# Do not edit this file. All edits should be made to mod_data/user.moonraker.conf, where you can override the settings in this file or add new settings.
# Не редактируйте этот файл. Все правки нужно вносить в файл mod_data/user.moonraker.conf, в котором можно переопределить параметры из этого файла или добавить новые параметры
[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /tmp/uds

[machine]
provider: systemd_cli
validate_service: false
validate_config: false

[file_manager]
file_system_observer: none

[authorization]
enable_api_key: false

[octoprint_compat]

# Enable print history tracking
[history]

[webcam video]
enabled: true
icon: mdiWebcam
service: mjpegstreamer-adaptive
stream_url: /webcam/?action=stream
snapshot_url: /webcam/?action=snapshot

[webcam screen]
service: iframe
target_fps: 10
stream_url: /screen/stream
snapshot_url: /screen/snapshot
aspect_ratio: 800:480

[update_manager]
enable_auto_refresh: True
enable_system_updates: False

[update_manager Z-Mod]
type: git_repo
channel: dev
path: /usr/data/zmod/zmod
origin: https://github.com/ghzserg/z_ff5m.git
is_system_service: False
primary_branch: 1.7

[update_manager klippy]
type: git_repo
channel: dev
path: /usr/data/zmod/klipper
origin: https://github.com/ghzserg/zmod_klipper.git
is_system_service: False
primary_branch: main

[update_manager moon]
type: git_repo
channel: dev
path: /usr/data/zmod/moonraker
origin: https://github.com/ghzserg/zmod_moonraker.git
is_system_service: False
primary_branch: main

[update_manager fluidd]
type: web
repo: ghzserg/fluidd
path: /root/fluidd

[update_manager mainsail]
type: web
channel: stable
repo: ghzserg/mainsail
path: /root/mainsail

[include mod_data/extra_plugins.moonraker.conf]

[include mod_data/plugins.moonraker.conf]

[include mod_data/user.moonraker.conf]
