# Below you can include specific configuration files depending on what you want KAMP to do:

[include Adaptive_Meshing.cfg]       # Include to enable adaptive meshing configuration.
[include Line_Purge.cfg]             # Include to enable adaptive line purging configuration.
[include Smart_Park.cfg]             # Include to enable the Smart Park function, which parks the printhead near the print area for final heating.

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP 

# The following variables are settings for KAMP as a whole.
variable_verbose_enable: True               # Set to True to enable KAMP information output when running. This is useful for debugging.

# The following variables are for adjusting adaptive mesh settings for KAMP.
variable_mesh_margin: 3                     # Expands the mesh size in millimeters if desired. Leave at 0 to disable.
variable_fuzz_amount: 3                     # Slightly randomizes mesh points to spread out wear from nozzle-based probes. Leave at 0 to disable.

# The following variables are for those with a dockable probe like Klicky, Euclid, etc.                 # ----------------  Attach Macro | Detach Macro
variable_probe_dock_enable: False           # Set to True to enable the usage of a dockable probe.      # ---------------------------------------------
variable_attach_macro: 'Attach_Probe'       # The macro that is used to attach the probe.               # Klicky Probe:   'Attach_Probe' | 'Dock_Probe'
variable_detach_macro: 'Dock_Probe'         # The macro that is used to store the probe.                # Euclid Probe:   'Deploy_Probe' | 'Stow_Probe'
                                                                                                        # Legacy Gcode:   'M401'         | 'M402'

# The following variables are for adjusting adaptive purge settings for KAMP.
variable_purge_height: 0.8                  # Z position of the nozzle during purging, default 0.8.
variable_tip_distance: 0                    # The distance between the filament tip and the nozzle before blowing. Should be similar to PRINT_END final retraction value.
variable_purge_margin: 20                   # The distance at which cleaning will be performed from the print area, by default it is 10.
variable_purge_amount: 30                   # The amount of filament that must be removed before printing.
variable_flow_rate: 12                      # Blowdown flow rate in mm3/s. Default is 12.

# The following variables are for adjusting the Smart Park feature for KAMP, which will park the printhead near the print area at a specified height.
variable_smart_park_height: 5               # Z position for Smart Park, default is 10.
variable_fast_x_start: 0.0
variable_fast_y_start: 0.0
variable_fast_x_end: 0.0
variable_fast_y_end: 0.0
variable_fast: False
variable_travel_speed: 0.0                  # If 0, (printer.toolhead.max_velocity) * 60 | float

gcode: # Gcode section left intentionally blank. Do not disturb.

    {action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}

[gcode_macro _RESET_FAST_KAMP]
gcode:
    _SET_FAST_KAMP {rawparams}

[gcode_macro _SET_FAST_KAMP]
gcode:
    {% set from = params.FROM|default("None")|string %}

    {% set x_start = params.X_START|default(0.0)|float %}
    {% set y_start = params.Y_START|default(0.0)|float %}
    {% set x_end = params.X_END|default(0.0)|float %}
    {% set y_end = params.Y_END|default(0.0)|float %}
    {% set fast = (x_end > x_start) and (y_end > y_start) %}

    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=fast_x_start VALUE={x_start}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=fast_y_start VALUE={y_start}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=fast_x_end VALUE={x_end}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=fast_y_end VALUE={y_end}
    SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=fast VALUE={1 if fast else 0}
    {% if fast %}
        RESPOND MSG="_SET_FAST_KAMP X:{x_start} Y:{y_start} to X:{x_end} Y:{y_end} // {from}"
    {% else %}
        RESPOND MSG="_RESET_FAST_KAMP // {from}"
    {% endif %}
