        {% elif zmesh_test == 4 %}
            RESPOND TYPE=command MSG="action:prompt_button Bett-Mesh vor Druck testen + AutoZOffset + KAMP|SAVE_ZMOD_DATA MESH_TEST=0 I=2|primary"
        {% else %}
