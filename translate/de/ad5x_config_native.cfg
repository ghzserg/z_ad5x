        {% elif zdisable_skew == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button SKEW-Korrektur deaktiviert|SAVE_ZMOD_DATA DISABLE_SKEW=0 I=3|primary"
        {% else %}
