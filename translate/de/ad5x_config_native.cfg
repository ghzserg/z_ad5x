        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button SCAN_FILE_COLORS benutzerdefinierter Wert: {zscan_file_colors}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors']|default(0)|int %}
        {% if zauto_assign_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Farben nicht automatisch zuweisen|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=30 I=1|primary"
        {% elif zauto_assign_colors == 30 %}
            RESPOND TYPE=command MSG="action:prompt_button Automatische Farbuweisung, Silent-Modus stoppt bei jedem Fehler|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=2 I=1|primary"
        {% elif zauto_assign_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Automatische Farbuweisung, Silent-Modus stoppt bei schwerem Fehler|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=1 I=1|primary"
        {% elif zauto_assign_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Farben automatisch zuweisen|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button Automatische Farbuweisung, Silent-Modus stoppt bei einigen Fehlern|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zcolor_menu_1_based = printer.save_variables.variables['color_menu_1_based']|default(1)|int %}
        {% if zcolor_menu_1_based == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Werkzeug-Indizes beginnend bei Null anzeigen (T0, T1, etc.)|SAVE_ZMOD_DATA COLOR_MENU_1_BASED=1 I=1|primary"
        {% elif zcolor_menu_1_based == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Werkzeug-Indizes beginnend bei Eins anzeigen (Color 1, Color 2, etc.)|SAVE_ZMOD_DATA COLOR_MENU_1_BASED=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button COLOR_MENU_1_BASED benutzerdefinierter Wert: {zcolor_menu_1_based}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        RESPOND TYPE=command MSG="action:prompt_footer_button Weiter|_GLOBAL N=2|red"
        RESPOND TYPE=command MSG="action:prompt_show"
        {% if this_page_visible_items == 0 %}
            RESPOND TYPE=command MSG="action:prompt_end"
            {% set n = 2 %}
        {% endif %}
    {% endif %}

    {% if n == 2 and start == 0 %}
