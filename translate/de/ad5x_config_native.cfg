        {% elif zscan_file_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Dateien nur auf vorbereitete Farb- / Materialdaten prüfen|SAVE_ZMOD_DATA SCAN_FILE_COLORS=1 I=1|primary"
        {% elif zscan_file_colors == 1 %}
