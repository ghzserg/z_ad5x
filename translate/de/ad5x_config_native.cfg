        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button FORCE_MD5 benutzerdefinierter Wert: {zforce_md5}|_GLOBAL N=2|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

