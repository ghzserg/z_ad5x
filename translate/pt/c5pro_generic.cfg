[gcode_macro _GOTO_SHAPER]
gcode:
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1 MOVE_SPEED=300 FROM=_GOTO_SHAPER
    G1 Z100 F1200
    SET_VELOCITY_LIMIT ACCEL=8000
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=100
    G1 X250 F30000
    G1 Y55.611
    G1 X280
    G1 X296.618 F5400
    M400
    MOTOR_GRAB
    G1 X276.618 F4800
    MOTOR_GRAB2
    G1 X250 F1500
    MOTOR_STOP
    SET_VELOCITY_LIMIT ACCEL=20000
    G1 X130 Y130 F6000
    M400

[gcode_macro _GOTO_END_SHAPER]
gcode:
    SET_VELOCITY_LIMIT ACCEL=8000
    SET_GCODE_OFFSET X=0 Y=0 MOVE=1 MOVE_SPEED=100
    G1 X250 F30000.000
    G1 Y55.611
    G1 X286.618
    G1 X296.618 F5400
    MOTOR_RELEASE
    G1 X250 F4800
    MOTOR_STOP
    SET_VELOCITY_LIMIT ACCEL=20000
    M114

