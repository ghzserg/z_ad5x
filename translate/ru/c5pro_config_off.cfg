    {% if screen == True %}
        SAVE_VARIABLE VARIABLE=display_off VALUE=0
    {% else %}
        SAVE_VARIABLE VARIABLE=display_off VALUE=1
    {% endif %}

    RUN_SHELL_COMMAND CMD=zfix_e0011 PARAMS="{zfix_e0011}"
    RUN_SHELL_COMMAND CMD=zfix_e0017 PARAMS="{zfix_e0017}"
    RUN_SHELL_COMMAND CMD=znice
    ZCONTROL_Z Z={zzcontrol_z}

    M115

    RUN_SHELL_COMMAND CMD=zversion
    _CHECK_VERSION
    IP SHOW=0

    {% if screen == False %}
        {% if zdisplay_off_timeout > 30 %}
            RESPOND PREFIX="info" MSG="Альтернативный экран долго загружается? Уменьшите время загрузки стандартного экрана. // SAVE_ZMOD_DATA DISPLAY_OFF_TIMEOUT=10"
        {% endif %}
        {% if zwifi == 0 %}
            RESPOND PREFIX="//" MSG="Устали от проблем с WiFi? Позвольте zmod управлять им. // SAVE_ZMOD_DATA WIFI=1"
        {% endif %}
    {% endif %}

[gcode_macro _RESET_ZMOD]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}

    RESPOND TYPE=command MSG="action:prompt_end"

    # Begin script-generated _RESET_ZMOD code

    # Color Selection
    SAVE_VARIABLE VARIABLE=scan_file_colors VALUE=0

    {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors'] %}
    {% if zauto_assign_colors == 0 or zauto_assign_colors == 30 or zauto_assign_colors == 2 or zauto_assign_colors == 1 %}
        SAVE_VARIABLE VARIABLE=auto_assign_colors VALUE=0
    {% endif %}

    SAVE_VARIABLE VARIABLE=color_menu_1_based VALUE=1

    # Print Start
    SAVE_VARIABLE VARIABLE=print_leveling VALUE=0

    SAVE_VARIABLE VARIABLE=print_autopa VALUE=0

    SAVE_VARIABLE VARIABLE=use_kamp VALUE=0

    SAVE_VARIABLE VARIABLE=mesh_test VALUE=0

    SAVE_VARIABLE VARIABLE=force_md5 VALUE=0

    SAVE_VARIABLE VARIABLE=disable_skew VALUE=1

    SAVE_VARIABLE VARIABLE=load_zoffset VALUE=1

    SAVE_VARIABLE VARIABLE=disable_priming VALUE=0

    SAVE_VARIABLE VARIABLE=silent VALUE=0

    {% set zclear = printer.save_variables.variables['clear'] %}
    {% if zclear == "LINE_PURGE" or zclear == "_CLEAR1" or zclear == "_CLEAR2" or zclear == "_CLEAR3" or zclear == "_CLEAR4" or zclear == "CLEAR_TRAP" %}
        SAVE_VARIABLE VARIABLE=clear VALUE="\"LINE_PURGE\""
    {% endif %}

    # Printing
    # Print End
    SAVE_VARIABLE VARIABLE=stop_motor VALUE=1

    SAVE_VARIABLE VARIABLE=auto_reboot VALUE=0

    # System
    SAVE_VARIABLE VARIABLE=save_restore VALUE=1

    SAVE_VARIABLE VARIABLE=fix_scv VALUE=1

    SAVE_VARIABLE VARIABLE=fix_e0011 VALUE=1

    SAVE_VARIABLE VARIABLE=fix_e0017 VALUE=1

    SAVE_VARIABLE VARIABLE=wifi VALUE=1

    {% set zled = printer.save_variables.variables['led'] %}
    {% if zled == 0 or zled == 25 or zled == 50 or zled == 75 or zled == 100 %}
        SAVE_VARIABLE VARIABLE=led VALUE=50
    {% endif %}

    SAVE_VARIABLE VARIABLE=web_screen VALUE=0

    SAVE_VARIABLE VARIABLE=china_cloud VALUE=1

    SAVE_VARIABLE VARIABLE=save_moonraker VALUE=0

    SAVE_VARIABLE VARIABLE=save_filament_sensors VALUE=0

    {% set zdisplay_off_timeout = printer.save_variables.variables['display_off_timeout'] %}
    {% if zdisplay_off_timeout == 5 or zdisplay_off_timeout == 20 or zdisplay_off_timeout == 60 %}
        SAVE_VARIABLE VARIABLE=display_off_timeout VALUE=20
    {% endif %}

    # End script-generated _RESET_ZMOD code

    SAVE_VARIABLE VARIABLE=skip_lang VALUE=0
    SAVE_VARIABLE VARIABLE=skip_global VALUE=0
    SAVE_VARIABLE VARIABLE=skip_recommend VALUE=0

    REBOOT

[gcode_macro _GLOBAL_RELOAD]
gcode:
    _GLOBAL N={ params.N|default(1)|int }

[gcode_macro _GLOBAL]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}

    {% set skip_global = printer.save_variables.variables['skip_global']|default(0) | int %}
    {% set skip_lang = printer.save_variables.variables['skip_lang']|default(0) | int %}
    {% set skip_recommend = printer.save_variables.variables['skip_recommend']|default(0) | int %}
    {% set skip_link = printer.save_variables.variables['skip_link']|default(0) | int %}

    {% set n = params.N|default(1)|int %}
    {% set start = params.START|default(0)|int %}

    {% if skip_global == 0 and skip_lang == 1 and start == 1 %}
        _SHOW_MSG MSG="Вы можете просматривать и изменять глобальные параметры при необходимости. Подробнее: https://wiki.zmod.link/ru/Global/" COMMAND="_GLOBAL"
    {% endif %}

    {% if skip_link == 0 and skip_global == 1 and skip_lang == 1 and skip_recommend == 1 and start == 1 %}
        _SHOW_MSG MSG="Знаете ли вы, что можно получить удалённый доступ к принтеру с помощью zmod.link?" COMMAND="_GLOBAL_SAVE PARAM='skip_link'"
    {% endif %}

    {% if start == 0 %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% endif %}

    # Begin script-generated _GLOBAL code

    {% if n == 1 and start == 0 %}
        {% set this_page_visible_items = 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin 1: Параметры, используемые в меню выбора цвета"

        {% set zscan_file_colors = printer.save_variables.variables['scan_file_colors']|default(0)|int %}
        {% if zscan_file_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Не сканировать файлы на наличие данных о цвете / материале|SAVE_ZMOD_DATA SCAN_FILE_COLORS=2 I=1|primary"
        {% elif zscan_file_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Проверять файлы только на наличие подготовленных данных о цвете / материале|SAVE_ZMOD_DATA SCAN_FILE_COLORS=1 I=1|primary"
        {% elif zscan_file_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Сканировать файлы на наличие данных о цвете / материале|SAVE_ZMOD_DATA SCAN_FILE_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button SCAN_FILE_COLORS пользовательское значение: {zscan_file_colors}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors']|default(0)|int %}
        {% if zauto_assign_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Не назначать цвета автоматически|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=30 I=1|primary"
        {% elif zauto_assign_colors == 30 %}
            RESPOND TYPE=command MSG="action:prompt_button Автоназначение цветов, тихий режим прерывается при любой ошибке|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=2 I=1|primary"
        {% elif zauto_assign_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Автоназначение цветов, тихий режим прерывается при серьезной ошибке|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=1 I=1|primary"
        {% elif zauto_assign_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Автоматически назначать цвета|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button Автоназначение цветов, тихий режим прерывается при некоторых ошибках|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zcolor_menu_1_based = printer.save_variables.variables['color_menu_1_based']|default(1)|int %}
        {% if zcolor_menu_1_based == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Отображать индексы инструментов от нуля (T0, T1 и т. д.)|SAVE_ZMOD_DATA COLOR_MENU_1_BASED=1 I=1|primary"
        {% elif zcolor_menu_1_based == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Отображать индексы инструментов от единицы (Color 1, Color 2 и т. д.)|SAVE_ZMOD_DATA COLOR_MENU_1_BASED=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button COLOR_MENU_1_BASED пользовательское значение: {zcolor_menu_1_based}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        RESPOND TYPE=command MSG="action:prompt_footer_button Далее|_GLOBAL N=2|red"
        RESPOND TYPE=command MSG="action:prompt_show"
        {% if this_page_visible_items == 0 %}
            RESPOND TYPE=command MSG="action:prompt_end"
            {% set n = 2 %}
        {% endif %}
    {% endif %}

    {% if n == 2 and start == 0 %}
        {% set this_page_visible_items = 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin 2: Текущие параметры используемые при начале печати [START_PRINT]"

        {% set zprint_leveling = printer.save_variables.variables['print_leveling']|default(0)|int %}
        {% if zprint_leveling == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Не строить карту стола при каждой печати|SAVE_ZMOD_DATA PRINT_LEVELING=1 I=2|primary"
        {% elif zprint_leveling == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button При каждой печати строить карту стола.|SAVE_ZMOD_DATA PRINT_LEVELING=0 I=2|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button PRINT_LEVELING пользовательское значение: {zprint_leveling}|_GLOBAL N=2|grey"
