    {% endif %}
    SAVE_VARIABLE VARIABLE=save_moonraker VALUE={zsave_moonraker}

    {% set zsave_filament_sensors = printer.save_variables.variables['save_filament_sensors']|default(0)|int %}
    {% if zsave_filament_sensors != 0 and zsave_filament_sensors != 1 %}
        {% set zsave_filament_sensors = 0 %}
    {% endif %}
    {% if zsave_filament_sensors == 0 %}
