    SAVE_VARIABLE VARIABLE=display_off_timeout VALUE={zdisplay_off_timeout}

    {% set zklipper13 = printer.save_variables.variables['klipper13']|default(0)|int %}
    {% if zklipper13 != 1 and zklipper13 != 0 %}
        {% set zklipper13 = 0 %}
    {% endif %}
    {% if zklipper13 == 0 %}
        RESPOND PREFIX="//" MSG="Используется родной Klipper 12 // SAVE_ZMOD_DATA KLIPPER13={zklipper13}"
    {% elif zklipper13 == 1 %}
        RESPOND PREFIX="//" MSG="Используется Klipper 13 // SAVE_ZMOD_DATA KLIPPER13={zklipper13}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: KLIPPER13 // SAVE_ZMOD_DATA KLIPPER13={zklipper13}"
    {% endif %}
