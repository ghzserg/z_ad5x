    {% elif zsave_filament_sensors == 1 %}
        RESPOND PREFIX="//" MSG="Сохранять состояние датчиков филамента // SAVE_ZMOD_DATA SAVE_FILAMENT_SENSORS={zsave_filament_sensors}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: SAVE_FILAMENT_SENSORS // SAVE_ZMOD_DATA SAVE_FILAMENT_SENSORS={zsave_filament_sensors}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=save_filament_sensors VALUE={zsave_filament_sensors}

    {% set zdisplay_off_timeout = printer.save_variables.variables['display_off_timeout']|default(20)|int %}
