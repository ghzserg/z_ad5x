[gcode_macro SAVE_ZMOD_DATA]
description: Сохранить параметры Z-Mod
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set i = params.I|default(0)|int %}

    # Begin script-generated SAVE_ZMOD_DATA code

    {% if params.SCAN_FILE_COLORS %}
        {% set zscan_file_colors = params.SCAN_FILE_COLORS|default(0)|int %}
        SAVE_VARIABLE VARIABLE=scan_file_colors VALUE={zscan_file_colors}
    {% endif %}

    {% if params.AUTO_ASSIGN_COLORS %}
        {% set zauto_assign_colors = params.AUTO_ASSIGN_COLORS|default(0)|int %}
        SAVE_VARIABLE VARIABLE=auto_assign_colors VALUE={zauto_assign_colors}
    {% endif %}

    {% if params.COLOR_MENU_1_BASED %}
        {% set zcolor_menu_1_based = params.COLOR_MENU_1_BASED|default(1)|int %}
        SAVE_VARIABLE VARIABLE=color_menu_1_based VALUE={zcolor_menu_1_based}
    {% endif %}

    {% if params.PRINT_LEVELING %}
        {% set zprint_leveling = params.PRINT_LEVELING|default(0)|int %}
        SAVE_VARIABLE VARIABLE=print_leveling VALUE={zprint_leveling}
    {% endif %}

    {% if params.PRINT_AUTOPA %}
        {% set zprint_autopa = params.PRINT_AUTOPA|default(0)|int %}
        SAVE_VARIABLE VARIABLE=print_autopa VALUE={zprint_autopa}
    {% endif %}

    {% if params.USE_KAMP %}
        {% set zuse_kamp = params.USE_KAMP|default(0)|int %}
        SAVE_VARIABLE VARIABLE=use_kamp VALUE={zuse_kamp}
    {% endif %}

    {% if params.MESH_TEST %}
        {% set zmesh_test = params.MESH_TEST|default(0)|int %}
        SAVE_VARIABLE VARIABLE=mesh_test VALUE={zmesh_test}
    {% endif %}

    {% if params.MIDI_START %}
        {% set zmidi_start = params.MIDI_START|default("")|string %}
        {% if zmidi_start == "0" %}
            {% set zmidi_start = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_start VALUE="\"{zmidi_start}\""
    {% endif %}

    {% if params.MIDI_PAUSE %}
        {% set zmidi_pause = params.MIDI_PAUSE|default("")|string %}
        {% if zmidi_pause == "0" %}
            {% set zmidi_pause = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_pause VALUE="\"{zmidi_pause}\""
    {% endif %}

    {% if params.FORCE_MD5 %}
        {% set zforce_md5 = params.FORCE_MD5|default(0)|int %}
        SAVE_VARIABLE VARIABLE=force_md5 VALUE={zforce_md5}
    {% endif %}

    {% if params.DISABLE_SKEW %}
        {% set zdisable_skew = params.DISABLE_SKEW|default(1)|int %}
        SAVE_VARIABLE VARIABLE=disable_skew VALUE={zdisable_skew}
    {% endif %}

    {% if params.LOAD_ZOFFSET %}
        {% set zload_zoffset = params.LOAD_ZOFFSET|default(1)|int %}
        SAVE_VARIABLE VARIABLE=load_zoffset VALUE={zload_zoffset}
    {% endif %}

    {% if params.DISABLE_PRIMING %}
        {% set zdisable_priming = params.DISABLE_PRIMING|default(0)|int %}
        SAVE_VARIABLE VARIABLE=disable_priming VALUE={zdisable_priming}
    {% endif %}

    {% if params.SILENT %}
        {% set zsilent = params.SILENT|default(0)|int %}
        SAVE_VARIABLE VARIABLE=silent VALUE={zsilent}
    {% endif %}

    {% if params.CLEAR %}
        {% set zclear = params.CLEAR|default("LINE_PURGE")|string %}
        {% if zclear == "0" %}
            {% set zclear = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=clear VALUE="\"{zclear}\""
    {% endif %}

    {% if params.ALWAYS_FULL_COLOR_CHANGE %}
        {% set zalways_full_color_change = params.ALWAYS_FULL_COLOR_CHANGE|default(0)|int %}
        SAVE_VARIABLE VARIABLE=always_full_color_change VALUE={zalways_full_color_change}
    {% endif %}

    {% if params.MIDI_END %}
        {% set zmidi_end = params.MIDI_END|default("")|string %}
        {% if zmidi_end == "0" %}
            {% set zmidi_end = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_end VALUE="\"{zmidi_end}\""
    {% endif %}

    {% if params.STOP_MOTOR %}
        {% set zstop_motor = params.STOP_MOTOR|default(1)|int %}
        SAVE_VARIABLE VARIABLE=stop_motor VALUE={zstop_motor}
    {% endif %}

    {% if params.AUTO_REBOOT %}
        {% set zauto_reboot = params.AUTO_REBOOT|default(0)|int %}
        SAVE_VARIABLE VARIABLE=auto_reboot VALUE={zauto_reboot}
    {% endif %}

    {% if params.SAVE_RESTORE %}
        {% set zsave_restore = params.SAVE_RESTORE|default(1)|int %}
        SAVE_VARIABLE VARIABLE=save_restore VALUE={zsave_restore}
    {% endif %}

    {% if params.FIX_SCV %}
        {% set zfix_scv = params.FIX_SCV|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_scv VALUE={zfix_scv}
    {% endif %}

    {% if params.FIX_E0011 %}
        {% set zfix_e0011 = params.FIX_E0011|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_e0011 VALUE={zfix_e0011}
    {% endif %}

    {% if params.FIX_E0017 %}
        {% set zfix_e0017 = params.FIX_E0017|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_e0017 VALUE={zfix_e0017}
    {% endif %}

    {% if params.WIFI %}
        {% set zwifi = params.WIFI|default(1)|int %}
        SAVE_VARIABLE VARIABLE=wifi VALUE={zwifi}
    {% endif %}

    {% if params.LED %}
        {% set zled = params.LED|default(50)|int %}
        SAVE_VARIABLE VARIABLE=led VALUE={zled}
    {% endif %}

    {% if params.WEB_SCREEN %}
        {% set zweb_screen = params.WEB_SCREEN|default(0)|int %}
        SAVE_VARIABLE VARIABLE=web_screen VALUE={zweb_screen}
    {% endif %}

    {% if params.MIDI_ON %}
        {% set zmidi_on = params.MIDI_ON|default("")|string %}
        {% if zmidi_on == "0" %}
            {% set zmidi_on = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_on VALUE="\"{zmidi_on}\""
    {% endif %}

    {% if params.CHINA_CLOUD %}
        {% set zchina_cloud = params.CHINA_CLOUD|default(1)|int %}
        SAVE_VARIABLE VARIABLE=china_cloud VALUE={zchina_cloud}
    {% endif %}

    {% if params.SAVE_MOONRAKER %}
        {% set zsave_moonraker = params.SAVE_MOONRAKER|default(0)|int %}
        SAVE_VARIABLE VARIABLE=save_moonraker VALUE={zsave_moonraker}
    {% endif %}

    {% if params.SAVE_FILAMENT_SENSORS %}
        {% set zsave_filament_sensors = params.SAVE_FILAMENT_SENSORS|default(0)|int %}
        SAVE_VARIABLE VARIABLE=save_filament_sensors VALUE={zsave_filament_sensors}
    {% endif %}

    {% if params.DISPLAY_OFF_TIMEOUT %}
        {% set zdisplay_off_timeout = params.DISPLAY_OFF_TIMEOUT|default(20)|int %}
        SAVE_VARIABLE VARIABLE=display_off_timeout VALUE={zdisplay_off_timeout}
    {% endif %}

    {% if params.KLIPPER13 %}
        {% set zklipper13 = params.KLIPPER13|default(0)|int %}
        SAVE_VARIABLE VARIABLE=klipper13 VALUE={zklipper13}
    {% endif %}

    {% if params.ZCONTROL_Z %}
        {% set zzcontrol_z = params.ZCONTROL_Z|default(10)|int %}
        SAVE_VARIABLE VARIABLE=zcontrol_z VALUE={zzcontrol_z}
    {% endif %}

    # End script-generated SAVE_ZMOD_DATA code

    {% if i == 0 %}
        GET_ZMOD_DATA
    {% else %}
        _GLOBAL N={i}
    {% endif %}

[gcode_macro GET_ZMOD_DATA]
description: Получить параметры Z-Mod
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}

    RESPOND PREFIX="info" MSG="Параметры Z-Mod. Задаются через SAVE_ZMOD_DATA"

    {% set guppy = printer.save_variables.variables['guppy']|default(1) | int %}
    SAVE_VARIABLE VARIABLE=guppy VALUE={guppy|int}

    {% set helix = printer.save_variables.variables['helix']|default(0) | int %}
    SAVE_VARIABLE VARIABLE=helix VALUE={helix|int}

    {% if screen == True %}
        RESPOND PREFIX="info" MSG="Вы работаете с родным экраном // DISPLAY_ON"
    {% else %}
        {% if helix == 1 %}
            RESPOND PREFIX="info" MSG="Вы работаете БЕЗ родного экрана c HelixScreen // DISPLAY_OFF HELIX=1"
            SAVE_VARIABLE VARIABLE=guppy VALUE=0
        {% elif guppy == 1 %}
            RESPOND PREFIX="info" MSG="Вы работаете БЕЗ родного экрана c GuppyScreen // DISPLAY_OFF GUPPY=1"
            SAVE_VARIABLE VARIABLE=helix VALUE=0
        {% else %}
            RESPOND PREFIX="info" MSG="Вы работаете БЕЗ родного экрана // DISPLAY_OFF GUPPY=0"
        {% endif %}
    {% endif %}

    # Begin script-generated GET_ZMOD_DATA code

    RESPOND PREFIX="info" MSG="Параметры, используемые в меню выбора цвета"

    {% set zscan_file_colors = printer.save_variables.variables['scan_file_colors']|default(0)|int %}
    {% if zscan_file_colors != 0 and zscan_file_colors != 2 and zscan_file_colors != 1 %}
        {% set zscan_file_colors = 0 %}
    {% endif %}
    {% if zscan_file_colors == 0 %}
        RESPOND PREFIX="//" MSG="Не сканировать файлы на наличие данных о цвете / материале // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% elif zscan_file_colors == 2 %}
        RESPOND PREFIX="//" MSG="Проверять файлы только на наличие подготовленных данных о цвете / материале // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% elif zscan_file_colors == 1 %}
        RESPOND PREFIX="//" MSG="Сканировать файлы на наличие данных о цвете / материале // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: SCAN_FILE_COLORS // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=scan_file_colors VALUE={zscan_file_colors}

    {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors']|default(0)|int %}
    {% if zauto_assign_colors < 0 %}
        {% set zauto_assign_colors = 0 %}
    {% endif %}
    {% if zauto_assign_colors > 30 %}
        {% set zauto_assign_colors = 30 %}
    {% endif %}
    {% if zauto_assign_colors == 0 %}
        RESPOND PREFIX="//" MSG="Не назначать цвета автоматически // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% elif zauto_assign_colors == 30 %}
        RESPOND PREFIX="//" MSG="Автоназначение при успехе, остановка печати в тихом режиме при любых ошибках // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% elif zauto_assign_colors == 2 %}
        RESPOND PREFIX="//" MSG="Автоназначение при успехе, остановка печати в тихом режиме при серьезных ошибках // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% elif zauto_assign_colors == 1 %}
        RESPOND PREFIX="//" MSG="Автоматически назначать цвета, если цвета файла успешно сканированы // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% else %}
        RESPOND PREFIX="//" MSG="Автоназначение при успехе, остановка печати в тихом режиме при некоторых ошибках // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=auto_assign_colors VALUE={zauto_assign_colors}

    {% set zcolor_menu_1_based = printer.save_variables.variables['color_menu_1_based']|default(1)|int %}
    {% if zcolor_menu_1_based != 0 and zcolor_menu_1_based != 1 %}
        {% set zcolor_menu_1_based = 1 %}
    {% endif %}
    {% if zcolor_menu_1_based == 0 %}
        RESPOND PREFIX="//" MSG="Отображать индексы инструментов от нуля (T0, T1 и т. д.) // SAVE_ZMOD_DATA COLOR_MENU_1_BASED={zcolor_menu_1_based}"
    {% elif zcolor_menu_1_based == 1 %}
        RESPOND PREFIX="//" MSG="Отображать индексы инструментов от единицы (Color 1, Color 2 и т. д.) // SAVE_ZMOD_DATA COLOR_MENU_1_BASED={zcolor_menu_1_based}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: COLOR_MENU_1_BASED // SAVE_ZMOD_DATA COLOR_MENU_1_BASED={zcolor_menu_1_based}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=color_menu_1_based VALUE={zcolor_menu_1_based}

    RESPOND PREFIX="info" MSG="Текущие параметры используемые при начале печати [START_PRINT]"

    {% set zprint_leveling = printer.save_variables.variables['print_leveling']|default(0)|int %}
    {% if zprint_leveling != 0 and zprint_leveling != 1 %}
        {% set zprint_leveling = 0 %}
    {% endif %}
    {% if zprint_leveling == 0 %}
        RESPOND PREFIX="//" MSG="Не строить карту стола при каждой печати // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% elif zprint_leveling == 1 %}
        RESPOND PREFIX="//" MSG="При каждой печати строить карту стола. // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: PRINT_LEVELING // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=print_leveling VALUE={zprint_leveling}

    {% set zprint_autopa = printer.save_variables.variables['print_autopa']|default(0)|int %}
    {% if zprint_autopa != 0 and zprint_autopa != 1 %}
        {% set zprint_autopa = 0 %}
    {% endif %}
    {% if zprint_autopa == 0 %}
        RESPOND PREFIX="//" MSG="Off Auto PA // SAVE_ZMOD_DATA PRINT_AUTOPA={zprint_autopa}"
    {% elif zprint_autopa == 1 %}
        RESPOND PREFIX="//" MSG="Auto PA // SAVE_ZMOD_DATA PRINT_AUTOPA={zprint_autopa}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: PRINT_AUTOPA // SAVE_ZMOD_DATA PRINT_AUTOPA={zprint_autopa}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=print_autopa VALUE={zprint_autopa}

    {% set zuse_kamp = printer.save_variables.variables['use_kamp']|default(0)|int %}
    {% if zuse_kamp != 0 and zuse_kamp != 1 %}
        {% set zuse_kamp = 0 %}
    {% endif %}
    {% if zuse_kamp == 0 %}
        RESPOND PREFIX="//" MSG="Снимать полную карту стола // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% elif zuse_kamp == 1 %}
        RESPOND PREFIX="//" MSG="Где возможно использовать адаптивную карту стола(KAMP), вместо полной карты стола // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: USE_KAMP // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=use_kamp VALUE={zuse_kamp}

    {% set zmesh_test = printer.save_variables.variables['mesh_test']|default(0)|int %}
    {% if zmesh_test != 0 and zmesh_test != 1 and zmesh_test != 2 and zmesh_test != 3 and zmesh_test != 4 %}
        {% set zmesh_test = 0 %}
    {% endif %}
    {% if zmesh_test == 0 %}
        RESPOND PREFIX="//" MSG="Не тестировать карту стола перед печатью // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 1 %}
        RESPOND PREFIX="//" MSG="Тестировать карту стола перед печатью // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 2 %}
        RESPOND PREFIX="//" MSG="Тестировать карту стола перед печатью + KAMP // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 3 %}
        RESPOND PREFIX="//" MSG="Тестировать карту стола перед печатью + AutoZOffset // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 4 %}
        RESPOND PREFIX="//" MSG="Тестировать карту стола перед печатью + AutoZOffset + KAMP // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: MESH_TEST // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=mesh_test VALUE={zmesh_test}

    {% set zmidi_start = printer.save_variables.variables['midi_start']|default("")|string %}
    RESPOND PREFIX="//" MSG="Играть MIDI при запуске печати: {zmidi_start} // SAVE_ZMOD_DATA MIDI_START=\"{zmidi_start}\""
    SAVE_VARIABLE VARIABLE=midi_start VALUE="\"{zmidi_start}\""

    {% set zmidi_pause = printer.save_variables.variables['midi_pause']|default("")|string %}
    RESPOND PREFIX="//" MSG="Играть MIDI при паузе печати: {zmidi_pause} // SAVE_ZMOD_DATA MIDI_PAUSE=\"{zmidi_pause}\""
    SAVE_VARIABLE VARIABLE=midi_pause VALUE="\"{zmidi_pause}\""

    {% set zforce_md5 = printer.save_variables.variables['force_md5']|default(0)|int %}
    {% if zforce_md5 != 0 and zforce_md5 != 1 %}
        {% set zforce_md5 = 0 %}
    {% endif %}
    {% if zforce_md5 == 0 %}
        RESPOND PREFIX="//" MSG="Не проверять MD5 сумму файла // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% elif zforce_md5 == 1 %}
        RESPOND PREFIX="//" MSG="Проверять MD5 сумму файла // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: FORCE_MD5 // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=force_md5 VALUE={zforce_md5}

    {% set zdisable_skew = printer.save_variables.variables['disable_skew']|default(1)|int %}
    {% if zdisable_skew != 0 and zdisable_skew != 1 %}
        {% set zdisable_skew = 1 %}
    {% endif %}
    {% if zdisable_skew == 0 %}
        RESPOND PREFIX="//" MSG="SKEW коррекция включена. Профиль skew_profile // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% elif zdisable_skew == 1 %}
        RESPOND PREFIX="//" MSG="SKEW коррекция отключена // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: DISABLE_SKEW // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=disable_skew VALUE={zdisable_skew}

    {% set zload_zoffset = printer.save_variables.variables['load_zoffset']|default(1)|int %}
    {% if zload_zoffset != 0 and zload_zoffset != 1 %}
        {% set zload_zoffset = 1 %}
    {% endif %}
    {% if zload_zoffset == 0 %}
        RESPOND PREFIX="//" MSG="Не загружать Z-Offset из глобальных параметров // SAVE_ZMOD_DATA LOAD_ZOFFSET={zload_zoffset}"
    {% elif zload_zoffset == 1 %}
        RESPOND PREFIX="//" MSG="Загрузка Z-Offset из глобальных параметров // SAVE_ZMOD_DATA LOAD_ZOFFSET={zload_zoffset}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: LOAD_ZOFFSET // SAVE_ZMOD_DATA LOAD_ZOFFSET={zload_zoffset}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=load_zoffset VALUE={zload_zoffset}

    {% set zdisable_priming = printer.save_variables.variables['disable_priming']|default(0)|int %}
    {% if zdisable_priming != 0 and zdisable_priming != 1 %}
        {% set zdisable_priming = 0 %}
    {% endif %}
    {% if zdisable_priming == 0 %}
        RESPOND PREFIX="//" MSG="Включить очистку сопла линией // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% elif zdisable_priming == 1 %}
        RESPOND PREFIX="//" MSG="Выключить очистку сопла линией // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: DISABLE_PRIMING // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=disable_priming VALUE={zdisable_priming}

    {% set zsilent = printer.save_variables.variables['silent']|default(0)|int %}
    {% if zsilent != 0 and zsilent != 1 %}
        {% set zsilent = 0 %}
    {% endif %}
    {% if zsilent == 0 %}
        RESPOND PREFIX="//" MSG="Не скрывать выбор цвета при запуске печати // SAVE_ZMOD_DATA SILENT={zsilent}"
    {% elif zsilent == 1 %}
        RESPOND PREFIX="//" MSG="Скрыть выбор цвета, печатать с IFS // SAVE_ZMOD_DATA SILENT={zsilent}"
    {% else %}
        RESPOND PREFIX="//" MSG="Нераспознанное значение для настройки: SILENT // SAVE_ZMOD_DATA SILENT={zsilent}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=silent VALUE={zsilent}

    {% if printer.save_variables.variables['disable_priming'] == 0 %}
        {% set zclear = printer.save_variables.variables['clear']|default("LINE_PURGE")|string %}
        RESPOND PREFIX="//" MSG="Алгоритм очистки линией: {zclear} // SAVE_ZMOD_DATA CLEAR=\"{zclear}\""
        SAVE_VARIABLE VARIABLE=clear VALUE="\"{zclear}\""
    {% endif %}

    RESPOND PREFIX="info" MSG="Параметры, используемые во время печати"

    {% set zalways_full_color_change = printer.save_variables.variables['always_full_color_change']|default(0)|int %}
    {% if zalways_full_color_change != 0 and zalways_full_color_change != 1 %}
        {% set zalways_full_color_change = 0 %}
    {% endif %}
    {% if zalways_full_color_change == 0 %}
        RESPOND PREFIX="//" MSG="Пропустить процесс смены цвета, если старый и новый цвета — это один и тот же физический канал IFS // SAVE_ZMOD_DATA ALWAYS_FULL_COLOR_CHANGE={zalways_full_color_change}"
    {% elif zalways_full_color_change == 1 %}
        RESPOND PREFIX="//" MSG="Не пропускать процесс смены цвета, если старый и новый цвета — это один и тот же физический канал IFS // SAVE_ZMOD_DATA ALWAYS_FULL_COLOR_CHANGE={zalways_full_color_change}"
    {% else %}
