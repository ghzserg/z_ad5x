            RESPOND TYPE=command MSG="action:prompt_button 当无法扫描文件颜色时显示 {zallowed_tool_count} 种颜色|SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT=4 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button 当无法扫描文件颜色时显示 {zallowed_tool_count} 种颜色|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zscan_file_colors = printer.save_variables.variables['scan_file_colors']|default(0)|int %}
        {% if zscan_file_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button 不扫描文件的颜色/材料数据|SAVE_ZMOD_DATA SCAN_FILE_COLORS=2 I=1|primary"
        {% elif zscan_file_colors == 2 %}
