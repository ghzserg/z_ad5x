        {% elif zscan_file_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button 扫描文件的颜色/材料数据|SAVE_ZMOD_DATA SCAN_FILE_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button SCAN_FILE_COLORS 自定义值: {zscan_file_colors}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors']|default(0)|int %}
        {% if zauto_assign_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button 不自动分配颜色|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=30 I=1|primary"
        {% elif zauto_assign_colors == 30 %}
            RESPOND TYPE=command MSG="action:prompt_button 自动分配颜色，静音模式在出现任何错误时停止|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=2 I=1|primary"
