## Client variable macro for your printer.cfg

[pause_resume]
#recover_velocity: 50.
#   When capture/restore is enabled, the speed at which to return to
#   the captured position (in mm/s). Default is 50.0 mm/s.

[display_status]

[respond]

[gcode_macro CANCEL_PRINT]
description: 取消当前打印任务
rename_existing: CANCEL_PRINT_BASE
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set allow_park = client.park_at_cancel | default(false) | lower == 'true' %}
  {% set retract = client.cancel_retract | default(5.0) | abs %}
  ##### define park position #####
  {% set park_x = "" if (client.park_at_cancel_x | default(none) is none)
            else "X=" ~ client.park_at_cancel_x %}
  {% set park_y = "" if (client.park_at_cancel_y | default(none) is none)
            else "Y=" ~ client.park_at_cancel_y %}
  {% set custom_park = park_x | length > 0 or park_y | length > 0 %}
  ##### end of definitions #####
  # restore idle_timeout time if needed
  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}
  {% if (custom_park or not printer.pause_resume.is_paused) and allow_park %} _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y} {% endif %}
  _CLIENT_RETRACT LENGTH={retract}
  TURN_OFF_HEATERS
  M106 S0
  {client.user_cancel_macro | default("")}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: 暂停当前打印
rename_existing: PAUSE_BASE
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set idle_timeout = client.idle_timeout | default(0) %}
  {% set heater_bed_temp = printer.heater_bed.target %}
  {% set current_speed = printer["gcode_move"].speed_factor %}
  {% set restore = False if printer.toolhead.extruder == ''
              else True  if params.RESTORE | default(1) | int == 1 else False %}
  {% set runout_resume = True if client.runout_sensor | default("") == ""   # no runout
                    else True if not printer[client.runout_sensor].enabled  # sensor is disabled
                    else printer[client.runout_sensor].filament_detected %} # sensor status
  {% set fan_speed = printer["fan_generic fanM106"].speed %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% if client.c5pro %}
    {% set t = printer['zmod_color'].active_tool_id | default(-1) | int %}
    {% set t0 = printer['extruder'].target %}
    {% set t1 = printer['extruder1'].target %}
    {% set t2 = printer['extruder2'].target %}
    {% set t3 = printer['extruder3'].target %}
    {% if t < 0 %}
        {% set temp = 0 %}
    {% else %}
        {% set extruder_name = 'extruder' if t == 0 else 'extruder' ~ t %}
        {% set temp = printer[extruder_name].target %}
    {% endif %}
  {% else %}
    {% set t = 0 %}
    {% set t0 = printer[extruder].target %}
    {% set t1 = 0 %}
    {% set t2 = 0 %}
    {% set t3 = 0 %}
    {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% endif %}
  ##### end of definitions #####

  RESPOND TYPE=echo MSG="暂停: 恢复: {restore}, 温度: {temp}/{heater_bed_temp} T{t}"
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp, 'heater_bed_temp': heater_bed_temp, 'speed': current_speed, 'fan_speed': fan_speed, 'x': pos.x, 'y': pos.y, 't': t, 't0': t0, 't1': t1, 't2': t2, 't3': t3}}"

    # set a new idle_timeout value
    {% if idle_timeout > 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
        SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    {% endif %}

    PAUSE_BASE

    {% set midi_pause = printer.save_variables.variables['midi_pause']|default("") | string %}
    {% if midi_pause != "" %}
        PLAY_MIDI FILE={midi_pause}
    {% endif %}

    {client.user_pause_macro | default("")}

    _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
    {% if client.ad5m %}
        UPDATE_DELAYED_GCODE ID=_GOTO_PAUSE DURATION=1
    {% endif %}

[gcode_macro RESUME]
description: 恢复当前打印
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0, 'heater_bed_temp': 80, 'speed': 100, 'fan_speed': 0, 'x': 0, 'y': 0, 't': 0, 't0': 0, 't1': 0, 't2': 0, 't3': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
variable_force_restore: True
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move | default(velocity) %}
  {% set runout_resume = True if client.runout_sensor | default("") == ""   # no runout
                    else True if not printer[client.runout_sensor].enabled  # sensor is disabled
                    else printer[client.runout_sensor].filament_detected %} # sensor status
  {% set can_extrude = True if printer.toolhead.extruder == ''           # no extruder defined in config
                  else printer[printer.toolhead.extruder].can_extrude %} # status of active extruder
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####
  #### Printer comming from timeout idle state ####
  RESPOND TYPE=echo MSG="恢复: 恢复: {last_extruder_temp.restore}, 温度: {last_extruder_temp.temp}/{last_extruder_temp.heater_bed_temp}, 状态: {printer.idle_timeout.state | upper}"
  {% if printer.idle_timeout.state | upper == "IDLE" or idle_state or force_restore %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      # we need to use the unicode (\u00B0) for the ° as py2 env's would throw an error otherwise
      RESPOND TYPE=echo MSG='{"正在恢复 \"%s\" 温度至 %3.1f/%3.1f\u00B0C Fan: %3.1f" % (printer.toolhead.extruder, last_extruder_temp.temp, last_extruder_temp.heater_bed_temp, last_extruder_temp.fan_speed) }'
        {% if client.c5pro %}
            M104 S{last_extruder_temp.t0} T0
            M104 S{last_extruder_temp.t1} T1
            M104 S{last_extruder_temp.t2} T2
            M104 S{last_extruder_temp.t3} T3
            {% if last_extruder_temp.t0 != 0 %}
                _WAIT_TEMP T=0 EXTRUDER_TEMP={last_extruder_temp.t0} BED_TEMP={last_extruder_temp.heater_bed_temp} FROM=RESUME
            {% endif %}
            {% if last_extruder_temp.t1 != 0 %}
                _WAIT_TEMP T=1 EXTRUDER_TEMP={last_extruder_temp.t1} BED_TEMP={last_extruder_temp.heater_bed_temp} FROM=RESUME
            {% endif %}
            {% if last_extruder_temp.t2 != 0 %}
                _WAIT_TEMP T=2 EXTRUDER_TEMP={last_extruder_temp.t2} BED_TEMP={last_extruder_temp.heater_bed_temp} FROM=RESUME
            {% endif %}
            {% if last_extruder_temp.t3 != 0 %}
                _WAIT_TEMP T=3 EXTRUDER_TEMP={last_extruder_temp.t3} BED_TEMP={last_extruder_temp.heater_bed_temp} FROM=RESUME
            {% endif %}
        {% else %}
            _WAIT_TEMP T={last_extruder_temp.t} EXTRUDER_TEMP={last_extruder_temp.temp} BED_TEMP={last_extruder_temp.heater_bed_temp} FROM=RESUME
        {% endif %}

      SET_FAN_SPEED FAN=fanM106 SPEED={last_extruder_temp.fan_speed}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"恢复已中断 !!! \"%s\" 温度不足 (1), 请加热后再次按RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" 温度不足, 请加热后再次按RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  #### Printer comming out of regular PAUSE state ####
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"恢复已中断 !!! \"%s\" 温度不足 (2), 请加热后再次按RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" 温度不足, 请加热后再次按RESUME" % printer.toolhead.extruder) %}
  {% endif %}

    {% if runout_resume %}
        {% if do_resume %}
            {% if restore_idle_timeout > 0 %}
                SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout}
            {% endif %} # restore idle_timeout time

            {client.user_resume_macro | default("")}
            _CLIENT_EXTRUDE

            {% if last_extruder_temp.y > client.max_y %}
                G1 Y{client.max_y} F{params.VELOCITY | default(sp_move)}
                M400
                G1 X{last_extruder_temp.x} F{params.VELOCITY | default(sp_move)}
                M400
            {% endif %}

            {% if client.c5pro %}
                _B_CHANGE_FILAMENT
            {% endif %}

            RESUME_BASE VELOCITY={params.VELOCITY | default(sp_move)}
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG='{"恢复已中断 !!! \"%s\" 检测到耗材用尽，请加载后按RESUME" % (client.runout_sensor.split(" "))[1]}'
        {% set _d = prompt_txt.append("\"%s\" 检测到耗材用尽，请加载后按RESUME" % (client.runout_sensor.split(" "))[1]) %}
    {% endif %}

    ##### Generate User Information box in case of abort #####
    {% if not (runout_resume and do_resume) %}
        RESPOND TYPE=command MSG="action:prompt_beginResumption interrupted!!!"
        {% for element in prompt_txt %}
            RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

##### internal use #####
[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set use_custom     = client.use_custom_pos | default(false) | lower == 'true' %}
  {% set custom_park_x  = client.custom_park_x | default(0.0) %}
  {% set custom_park_y  = client.custom_park_y | default(0.0) %}
  {% set park_dz        = client.custom_park_dz | default(2.0) | abs %}
  {% set sp_hop         = client.speed_hop | default(15) * 60 %}
  {% set sp_move        = client.speed_move | default(velocity) * 60 %}
  ##### get config and toolhead values #####
  {% set origin    = printer.gcode_move.homing_origin %}
  {% set act       = printer.gcode_move.gcode_position %}
  {% if client.c5pro %}
    {% set z_max = 256 %}
  {% else %}
    {% set z_max = [ printer['gcode_macro G28'].z | default(220), 220 ] | min %}
  {% endif %}
  {% set max       = {'x': client.max_x, 'y': client.max_y, 'z': z_max} %}
  {% set cone      = printer.toolhead.cone_start_z | default(max.z) %} ; height as long the toolhead can reach max and min of an delta
  {% set round_bed = True if printer.configfile.settings.printer.kinematics is in ['delta','polar','rotary_delta','winch']
                else False %}
  ##### define park position #####
  {% set z_min = params.Z_MIN | default(0) | float %}
  {% set z_park = [[[(act.z + park_dz), z_min]|max, (max.z - origin.z)] | min, z_max] | min %}
  {% set x_park = params.X       if params.X is defined
             else custom_park_x  if use_custom
             else 0.0            if round_bed
             else (max.x - 5.0) %}
  {% set y_park = params.Y       if params.Y is defined
             else custom_park_y  if use_custom
             else (max.y - 5.0)  if round_bed and z_park < cone
             else 0.0            if round_bed
             else (max.y - 5.0) %}
  ##### end of definitions #####
  _CLIENT_RETRACT
  {% if "xyz" in printer.toolhead.homed_axes %}
    M400
    G90
    G1 Z{z_park} F{sp_hop}
    {% if printer.gcode_move.gcode_position.x != x_park %}
        {% if printer.gcode_move.gcode_position.y > client.max_y %}
            G1 Y{client.max_y} F{sp_move}
            M400
        {% endif %}
        G1 X{x_park} F{sp_move}
        M400
    {% endif %}
    G1 Y{y_park} F{sp_move}
    M400
    {% if not printer.gcode_move.absolute_coordinates %} G91 {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG="打印机未归零（G28）"
  {% endif %}

[gcode_macro _CLIENT_EXTRUDE]
description: 足够温度时挤出
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set use_fw_retract = (client.use_fw_retract | default(false) | lower == 'true') and (printer.firmware_retraction is defined) %}
  {% set length = params.LENGTH | default(client.unretract) | default(1.0) | float %}
  {% set speed = params.SPEED | default(client.speed_unretract) | default(35) | int %}
  {% set absolute_extrude = printer.gcode_move.absolute_extrude %}
  ##### end of definitions #####
  {% if printer.toolhead.extruder != '' %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
      {% if use_fw_retract %}
        {% if length < 0 %}
          G10
        {% else %}
          G11
        {% endif %}
      {% else %}
        M83
        G1 E{length} F{(speed | float | abs) * 60}
        {% if absolute_extrude %}
          M82
        {% endif %}
      {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG='{"\"%s\" 温度不足" % printer.toolhead.extruder}'
    {% endif %}
  {% endif %}

[gcode_macro _CLIENT_RETRACT]
description: 足够温度时回抽
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set length = params.LENGTH | default(client.retract) | default(1.0) | float %}
  {% set speed = params.SPEED | default(client.speed_retract) | default(35) | int %}

  _CLIENT_EXTRUDE LENGTH=-{length | float | abs} SPEED={speed | float | abs}
