[gcode_macro _RESET_ZMOD]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}

    RESPOND TYPE=command MSG="action:prompt_end"

    # Begin script-generated _RESET_ZMOD code

    # Color Selection
    {% set zallowed_tool_count = printer.save_variables.variables['allowed_tool_count'] %}
    {% if zallowed_tool_count == 4 or zallowed_tool_count == 8 or zallowed_tool_count == 16 %}
        SAVE_VARIABLE VARIABLE=allowed_tool_count VALUE=4
    {% endif %}

    SAVE_VARIABLE VARIABLE=scan_file_colors VALUE=0

    {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors'] %}
    {% if zauto_assign_colors == 0 or zauto_assign_colors == 30 or zauto_assign_colors == 2 or zauto_assign_colors == 1 %}
        SAVE_VARIABLE VARIABLE=auto_assign_colors VALUE=0
    {% endif %}

    SAVE_VARIABLE VARIABLE=color_menu_1_based VALUE=0

    # Print Start
    SAVE_VARIABLE VARIABLE=print_leveling VALUE=0

    SAVE_VARIABLE VARIABLE=use_kamp VALUE=0

    SAVE_VARIABLE VARIABLE=mesh_test VALUE=0

    SAVE_VARIABLE VARIABLE=force_md5 VALUE=0

    SAVE_VARIABLE VARIABLE=disable_skew VALUE=1

    SAVE_VARIABLE VARIABLE=load_zoffset VALUE=1

    SAVE_VARIABLE VARIABLE=disable_priming VALUE=0

    SAVE_VARIABLE VARIABLE=silent VALUE=0

    {% set zclear = printer.save_variables.variables['clear'] %}
    {% if zclear == "LINE_PURGE" or zclear == "_CLEAR1" or zclear == "_CLEAR2" or zclear == "_CLEAR3" or zclear == "_CLEAR4" or zclear == "CLEAR_TRAP" %}
        SAVE_VARIABLE VARIABLE=clear VALUE="\"LINE_PURGE\""
    {% endif %}

    # Printing
    SAVE_VARIABLE VARIABLE=use_trash_on_print VALUE=1

    # Print End
    SAVE_VARIABLE VARIABLE=stop_motor VALUE=1

    SAVE_VARIABLE VARIABLE=auto_reboot VALUE=0

    SAVE_VARIABLE VARIABLE=remove_filament VALUE=0

    # System
    SAVE_VARIABLE VARIABLE=save_restore VALUE=1

    SAVE_VARIABLE VARIABLE=autoinsert VALUE=1

    SAVE_VARIABLE VARIABLE=fix_scv VALUE=1

    SAVE_VARIABLE VARIABLE=fix_e0011 VALUE=1

    SAVE_VARIABLE VARIABLE=fix_e0017 VALUE=1

    SAVE_VARIABLE VARIABLE=wifi VALUE=1

    {% set zled = printer.save_variables.variables['led'] %}
    {% if zled == 0 or zled == 25 or zled == 50 or zled == 75 or zled == 100 %}
        SAVE_VARIABLE VARIABLE=led VALUE=50
    {% endif %}

