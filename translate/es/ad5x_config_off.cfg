    {% endif %}

    # End script-generated _RESET_ZMOD code

    SAVE_VARIABLE VARIABLE=skip_lang VALUE=0
    SAVE_VARIABLE VARIABLE=skip_global VALUE=0
    SAVE_VARIABLE VARIABLE=skip_recommend VALUE=0

    REBOOT

[gcode_macro _GLOBAL]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}

    {% set skip_global = printer.save_variables.variables.skip_global|default(0) | int %}
    {% set skip_lang = printer.save_variables.variables.skip_lang|default(0) | int %}
    {% set skip_recommend = printer.save_variables.variables.skip_recommend|default(0) | int %}
    {% set skip_link = printer.save_variables.variables.skip_link|default(0) | int %}

    {% set n = params.N|default(1)|int %}
    {% set start = params.START|default(0)|int %}

    {% if skip_global == 0 and skip_lang == 1 and start == 1 %}
        _SHOW_MSG MSG="Puede explorar y cambiar parámetros globales si es necesario. https://wiki.zmod.link/Global/" COMMAND="_GLOBAL"
    {% endif %}

    {% if skip_link == 0 and skip_global == 1 and skip_lang == 1 and skip_recommend == 1 and start == 1 %}
        _SHOW_MSG MSG="¿Sabías que puedes acceder a tu impresora de forma remota usando zmod.link?" COMMAND="_GLOBAL_SAVE PARAM='skip_link'"
    {% endif %}

    {% if start == 0 %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% endif %}

    # Begin script-generated _GLOBAL code

    {% if n == 1 and start == 0 %}
        {% set this_page_visible_items = 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin 1: Parámetros utilizados en el menú de selección de color"

        {% set zallowed_tool_count = printer.save_variables.variables['allowed_tool_count']|default(4)|int %}
        {% if zallowed_tool_count == 4 %}
            RESPOND TYPE=command MSG="action:prompt_button Mostrar {zallowed_tool_count} colores cuando no se puedan escanear los colores del archivo|SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT=8 I=1|primary"
        {% elif zallowed_tool_count == 8 %}
            RESPOND TYPE=command MSG="action:prompt_button Mostrar {zallowed_tool_count} colores cuando no se puedan escanear los colores del archivo|SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT=16 I=1|primary"
        {% elif zallowed_tool_count == 16 %}
            RESPOND TYPE=command MSG="action:prompt_button Mostrar {zallowed_tool_count} colores cuando no se puedan escanear los colores del archivo|SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT=4 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button Mostrar {zallowed_tool_count} colores cuando no se puedan escanear los colores del archivo|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zscan_file_colors = printer.save_variables.variables['scan_file_colors']|default(0)|int %}
        {% if zscan_file_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button No escanear archivos para datos de color / material|SAVE_ZMOD_DATA SCAN_FILE_COLORS=2 I=1|primary"
        {% elif zscan_file_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Comprobar solo datos de color / material preparados en los archivos|SAVE_ZMOD_DATA SCAN_FILE_COLORS=1 I=1|primary"
        {% elif zscan_file_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Escanear archivos para datos de color / material|SAVE_ZMOD_DATA SCAN_FILE_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button SCAN_FILE_COLORS valor personalizado: {zscan_file_colors}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors']|default(0)|int %}
        {% if zauto_assign_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button No asignar colores automáticamente|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=30 I=1|primary"
        {% elif zauto_assign_colors == 30 %}
            RESPOND TYPE=command MSG="action:prompt_button Asignación automática, el modo silencioso se detiene ante cualquier error|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=2 I=1|primary"
        {% elif zauto_assign_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Asignación automática, el modo silencioso se detiene ante un error grave|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=1 I=1|primary"
        {% elif zauto_assign_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Asignar colores automáticamente|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button Asignación automática, el modo silencioso se detiene ante algunos errores|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zcolor_menu_1_based = printer.save_variables.variables['color_menu_1_based']|default(0)|int %}
        {% if zcolor_menu_1_based == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Mostrar índices de herramientas basados en cero (T0, T1, etc.)|SAVE_ZMOD_DATA COLOR_MENU_1_BASED=1 I=1|primary"
        {% elif zcolor_menu_1_based == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Mostrar índices de herramientas basados en uno (Color 1, Color 2, etc.)|SAVE_ZMOD_DATA COLOR_MENU_1_BASED=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button COLOR_MENU_1_BASED valor personalizado: {zcolor_menu_1_based}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        RESPOND TYPE=command MSG="action:prompt_footer_button Siguiente|_GLOBAL N=2|red"
        RESPOND TYPE=command MSG="action:prompt_show"
        {% if this_page_visible_items == 0 %}
            RESPOND TYPE=command MSG="action:prompt_end"
            _GLOBAL N=2
        {% endif %}
