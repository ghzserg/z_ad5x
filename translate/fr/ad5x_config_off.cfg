[gcode_macro SAVE_ZMOD_DATA]
description: Sauvegarder les paramètres Z-Mod
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set i = params.I|default(0)|int %}

    # Begin script-generated SAVE_ZMOD_DATA code

    {% if params.ALLOWED_TOOL_COUNT %}
        {% set zallowed_tool_count = params.ALLOWED_TOOL_COUNT|default(4)|int %}
        SAVE_VARIABLE VARIABLE=allowed_tool_count VALUE={zallowed_tool_count}
    {% endif %}

    {% if params.SCAN_FILE_COLORS %}
        {% set zscan_file_colors = params.SCAN_FILE_COLORS|default(0)|int %}
        SAVE_VARIABLE VARIABLE=scan_file_colors VALUE={zscan_file_colors}
    {% endif %}

    {% if params.AUTO_ASSIGN_COLORS %}
        {% set zauto_assign_colors = params.AUTO_ASSIGN_COLORS|default(0)|int %}
        SAVE_VARIABLE VARIABLE=auto_assign_colors VALUE={zauto_assign_colors}
    {% endif %}

    {% if params.COLOR_MENU_1_BASED %}
        {% set zcolor_menu_1_based = params.COLOR_MENU_1_BASED|default(0)|int %}
        SAVE_VARIABLE VARIABLE=color_menu_1_based VALUE={zcolor_menu_1_based}
    {% endif %}

    {% if params.PRINT_LEVELING %}
        {% set zprint_leveling = params.PRINT_LEVELING|default(0)|int %}
        SAVE_VARIABLE VARIABLE=print_leveling VALUE={zprint_leveling}
    {% endif %}

    {% if params.USE_KAMP %}
        {% set zuse_kamp = params.USE_KAMP|default(0)|int %}
        SAVE_VARIABLE VARIABLE=use_kamp VALUE={zuse_kamp}
    {% endif %}

    {% if params.MESH_TEST %}
        {% set zmesh_test = params.MESH_TEST|default(0)|int %}
        SAVE_VARIABLE VARIABLE=mesh_test VALUE={zmesh_test}
    {% endif %}

    {% if params.MIDI_START %}
        {% set zmidi_start = params.MIDI_START|default("")|string %}
        {% if zmidi_start == "0" %}
            {% set zmidi_start = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_start VALUE="\"{zmidi_start}\""
    {% endif %}

    {% if params.MIDI_PAUSE %}
        {% set zmidi_pause = params.MIDI_PAUSE|default("")|string %}
        {% if zmidi_pause == "0" %}
            {% set zmidi_pause = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_pause VALUE="\"{zmidi_pause}\""
    {% endif %}

    {% if params.FORCE_MD5 %}
        {% set zforce_md5 = params.FORCE_MD5|default(0)|int %}
        SAVE_VARIABLE VARIABLE=force_md5 VALUE={zforce_md5}
    {% endif %}

    {% if params.DISABLE_SKEW %}
        {% set zdisable_skew = params.DISABLE_SKEW|default(1)|int %}
        SAVE_VARIABLE VARIABLE=disable_skew VALUE={zdisable_skew}
    {% endif %}

    {% if params.LOAD_ZOFFSET %}
        {% set zload_zoffset = params.LOAD_ZOFFSET|default(1)|int %}
        SAVE_VARIABLE VARIABLE=load_zoffset VALUE={zload_zoffset}
    {% endif %}

    {% if params.DISABLE_PRIMING %}
        {% set zdisable_priming = params.DISABLE_PRIMING|default(0)|int %}
        SAVE_VARIABLE VARIABLE=disable_priming VALUE={zdisable_priming}
    {% endif %}

    {% if params.SILENT %}
        {% set zsilent = params.SILENT|default(0)|int %}
        SAVE_VARIABLE VARIABLE=silent VALUE={zsilent}
    {% endif %}

    {% if params.CLEAR %}
        {% set zclear = params.CLEAR|default("LINE_PURGE")|string %}
        {% if zclear == "0" %}
            {% set zclear = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=clear VALUE="\"{zclear}\""
    {% endif %}

    {% if params.USE_TRASH_ON_PRINT %}
        {% set zuse_trash_on_print = params.USE_TRASH_ON_PRINT|default(1)|int %}
        SAVE_VARIABLE VARIABLE=use_trash_on_print VALUE={zuse_trash_on_print}
    {% endif %}

    {% if params.ALWAYS_FULL_COLOR_CHANGE %}
        {% set zalways_full_color_change = params.ALWAYS_FULL_COLOR_CHANGE|default(0)|int %}
        SAVE_VARIABLE VARIABLE=always_full_color_change VALUE={zalways_full_color_change}
    {% endif %}

    {% if params.MIDI_END %}
        {% set zmidi_end = params.MIDI_END|default("")|string %}
        {% if zmidi_end == "0" %}
            {% set zmidi_end = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_end VALUE="\"{zmidi_end}\""
    {% endif %}

    {% if params.STOP_MOTOR %}
        {% set zstop_motor = params.STOP_MOTOR|default(1)|int %}
        SAVE_VARIABLE VARIABLE=stop_motor VALUE={zstop_motor}
    {% endif %}

    {% if params.AUTO_REBOOT %}
        {% set zauto_reboot = params.AUTO_REBOOT|default(0)|int %}
        SAVE_VARIABLE VARIABLE=auto_reboot VALUE={zauto_reboot}
    {% endif %}

    {% if params.REMOVE_FILAMENT %}
        {% set zremove_filament = params.REMOVE_FILAMENT|default(0)|int %}
        SAVE_VARIABLE VARIABLE=remove_filament VALUE={zremove_filament}
    {% endif %}

    {% if params.SAVE_RESTORE %}
        {% set zsave_restore = params.SAVE_RESTORE|default(1)|int %}
        SAVE_VARIABLE VARIABLE=save_restore VALUE={zsave_restore}
    {% endif %}

    {% if params.AUTOINSERT %}
        {% set zautoinsert = params.AUTOINSERT|default(1)|int %}
        SAVE_VARIABLE VARIABLE=autoinsert VALUE={zautoinsert}
    {% endif %}

    {% if params.FIX_SCV %}
        {% set zfix_scv = params.FIX_SCV|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_scv VALUE={zfix_scv}
    {% endif %}

    {% if params.FIX_E0011 %}
        {% set zfix_e0011 = params.FIX_E0011|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_e0011 VALUE={zfix_e0011}
    {% endif %}

    {% if params.FIX_E0017 %}
        {% set zfix_e0017 = params.FIX_E0017|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_e0017 VALUE={zfix_e0017}
    {% endif %}

    {% if params.WIFI %}
        {% set zwifi = params.WIFI|default(1)|int %}
        SAVE_VARIABLE VARIABLE=wifi VALUE={zwifi}
    {% endif %}

    {% if params.LED %}
        {% set zled = params.LED|default(50)|int %}
        SAVE_VARIABLE VARIABLE=led VALUE={zled}
    {% endif %}

    {% if params.MIDI_ON %}
        {% set zmidi_on = params.MIDI_ON|default("")|string %}
        {% if zmidi_on == "0" %}
            {% set zmidi_on = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_on VALUE="\"{zmidi_on}\""
    {% endif %}

    {% if params.CHINA_CLOUD %}
        {% set zchina_cloud = params.CHINA_CLOUD|default(1)|int %}
        SAVE_VARIABLE VARIABLE=china_cloud VALUE={zchina_cloud}
    {% endif %}

    {% if params.SAVE_MOONRAKER %}
        {% set zsave_moonraker = params.SAVE_MOONRAKER|default(0)|int %}
        SAVE_VARIABLE VARIABLE=save_moonraker VALUE={zsave_moonraker}
    {% endif %}

    {% if params.SAVE_FILAMENT_SENSORS %}
        {% set zsave_filament_sensors = params.SAVE_FILAMENT_SENSORS|default(0)|int %}
        SAVE_VARIABLE VARIABLE=save_filament_sensors VALUE={zsave_filament_sensors}
    {% endif %}

    {% if params.DISPLAY_OFF_TIMEOUT %}
        {% set zdisplay_off_timeout = params.DISPLAY_OFF_TIMEOUT|default(20)|int %}
        SAVE_VARIABLE VARIABLE=display_off_timeout VALUE={zdisplay_off_timeout}
    {% endif %}

    {% if params.KLIPPER13 %}
        {% set zklipper13 = params.KLIPPER13|default(0)|int %}
        SAVE_VARIABLE VARIABLE=klipper13 VALUE={zklipper13}
    {% endif %}

    {% if params.NICE %}
        {% set znice = params.NICE|default(20)|int %}
        SAVE_VARIABLE VARIABLE=nice VALUE={znice}
    {% endif %}

    {% if params.ZCONTROL_Z %}
        {% set zzcontrol_z = params.ZCONTROL_Z|default(10)|int %}
        SAVE_VARIABLE VARIABLE=zcontrol_z VALUE={zzcontrol_z}
    {% endif %}

    # End script-generated SAVE_ZMOD_DATA code

    {% if i == 0 %}
        GET_ZMOD_DATA
    {% else %}
        _GLOBAL N={i}
    {% endif %}

[gcode_macro GET_ZMOD_DATA]
description: Obtenir les paramètres Z-Mod
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}

    RESPOND PREFIX="info" MSG="Paramètres Z-Mod. Régler via SAVE_ZMOD_DATA"

    {% set guppy = printer.save_variables.variables['guppy']|default(1) | int %}
    SAVE_VARIABLE VARIABLE=guppy VALUE={guppy|int}

    {% set helix = printer.save_variables.variables['helix']|default(0) | int %}
    SAVE_VARIABLE VARIABLE=helix VALUE={helix|int}

    {% if screen == True %}
        RESPOND PREFIX="info" MSG="Vous utilisez l'écran natif // DISPLAY_ON"
    {% else %}
        {% if helix == 1 %}
            RESPOND PREFIX="info" MSG="Vous travaillez SANS écran natif avec HelixScreen // DISPLAY_OFF HELIX=1"
            SAVE_VARIABLE VARIABLE=guppy VALUE=0
        {% elif guppy == 1 %}
            RESPOND PREFIX="info" MSG="Vous travaillez SANS écran mais AVEC GuppyScreen // DISPLAY_OFF GUPPY=1"
            SAVE_VARIABLE VARIABLE=helix VALUE=0
        {% else %}
            RESPOND PREFIX="info" MSG="Vous travaillez SANS écran natif // DISPLAY_OFF GUPPY=0"
        {% endif %}
    {% endif %}

    # Begin script-generated GET_ZMOD_DATA code

    RESPOND PREFIX="info" MSG="Paramètres utilisés dans le menu de sélection des couleurs"

    {% set zallowed_tool_count = printer.save_variables.variables['allowed_tool_count']|default(4)|int %}
    {% if zallowed_tool_count < 1 %}
        {% set zallowed_tool_count = 1 %}
    {% endif %}
    {% if zallowed_tool_count > 16 %}
        {% set zallowed_tool_count = 16 %}
    {% endif %}
    RESPOND PREFIX="//" MSG="Afficher {zallowed_tool_count} couleurs quand les couleurs du fichier ne peuvent pas être lues // SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT={zallowed_tool_count}"
    SAVE_VARIABLE VARIABLE=allowed_tool_count VALUE={zallowed_tool_count}

    {% set zscan_file_colors = printer.save_variables.variables['scan_file_colors']|default(0)|int %}
    {% if zscan_file_colors != 0 and zscan_file_colors != 2 and zscan_file_colors != 1 %}
        {% set zscan_file_colors = 0 %}
    {% endif %}
    {% if zscan_file_colors == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas numériser les fichiers pour les données de couleur / matériel // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% elif zscan_file_colors == 2 %}
        RESPOND PREFIX="//" MSG="Vérifier uniquement les données de couleur / matériel pré-préparées dans les fichiers // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% elif zscan_file_colors == 1 %}
        RESPOND PREFIX="//" MSG="Numériser les fichiers pour les données de couleur / matériel // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : SCAN_FILE_COLORS // SAVE_ZMOD_DATA SCAN_FILE_COLORS={zscan_file_colors}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=scan_file_colors VALUE={zscan_file_colors}

    {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors']|default(0)|int %}
    {% if zauto_assign_colors < 0 %}
        {% set zauto_assign_colors = 0 %}
    {% endif %}
    {% if zauto_assign_colors > 30 %}
        {% set zauto_assign_colors = 30 %}
    {% endif %}
    {% if zauto_assign_colors == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas assigner les couleurs automatiquement // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% elif zauto_assign_colors == 30 %}
        RESPOND PREFIX="//" MSG="Assigner auto si succès, arrêter l'impression en mode silencieux sur toute erreur d'assignation // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% elif zauto_assign_colors == 2 %}
        RESPOND PREFIX="//" MSG="Assigner auto si succès, arrêter l'impression en mode silencieux sur erreurs d'assignation graves // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% elif zauto_assign_colors == 1 %}
        RESPOND PREFIX="//" MSG="Assigner auto les couleurs si les couleurs du fichier sont lues avec succès // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% else %}
        RESPOND PREFIX="//" MSG="Assigner auto si succès, arrêter l'impression en mode silencieux sur certaines erreurs d'assignation // SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS={zauto_assign_colors}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=auto_assign_colors VALUE={zauto_assign_colors}

    {% set zcolor_menu_1_based = printer.save_variables.variables['color_menu_1_based']|default(0)|int %}
    {% if zcolor_menu_1_based != 0 and zcolor_menu_1_based != 1 %}
        {% set zcolor_menu_1_based = 0 %}
    {% endif %}
    {% if zcolor_menu_1_based == 0 %}
        RESPOND PREFIX="//" MSG="Afficher les index d'outils à partir de zéro (T0, T1, etc.) // SAVE_ZMOD_DATA COLOR_MENU_1_BASED={zcolor_menu_1_based}"
    {% elif zcolor_menu_1_based == 1 %}
        RESPOND PREFIX="//" MSG="Afficher les index d'outils à partir de un (Color 1, Color 2, etc.) // SAVE_ZMOD_DATA COLOR_MENU_1_BASED={zcolor_menu_1_based}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : COLOR_MENU_1_BASED // SAVE_ZMOD_DATA COLOR_MENU_1_BASED={zcolor_menu_1_based}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=color_menu_1_based VALUE={zcolor_menu_1_based}

    RESPOND PREFIX="info" MSG="Paramètres utilisés au démarrage/nivellement [START_PRINT]"

    {% set zprint_leveling = printer.save_variables.variables['print_leveling']|default(0)|int %}
    {% if zprint_leveling != 0 and zprint_leveling != 1 %}
        {% set zprint_leveling = 0 %}
    {% endif %}
    {% if zprint_leveling == 0 %}
        RESPOND PREFIX="//" MSG="Ne construisez pas de maillage de lit sur chaque impression // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% elif zprint_leveling == 1 %}
        RESPOND PREFIX="//" MSG="Créer un maillage à chaque impression. // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : PRINT_LEVELING // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=print_leveling VALUE={zprint_leveling}

    {% set zuse_kamp = printer.save_variables.variables['use_kamp']|default(0)|int %}
    {% if zuse_kamp != 0 and zuse_kamp != 1 %}
        {% set zuse_kamp = 0 %}
    {% endif %}
    {% if zuse_kamp == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas utiliser KAMP à la place de BED_MESH_CALIBRATE // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% elif zuse_kamp == 1 %}
        RESPOND PREFIX="//" MSG="Préférer le maillage adaptatif (KAMP) // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : USE_KAMP // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=use_kamp VALUE={zuse_kamp}

    {% set zmesh_test = printer.save_variables.variables['mesh_test']|default(0)|int %}
    {% if zmesh_test != 0 and zmesh_test != 1 and zmesh_test != 2 and zmesh_test != 3 and zmesh_test != 4 %}
        {% set zmesh_test = 0 %}
    {% endif %}
    {% if zmesh_test == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas tester le maillage avant impression // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 1 %}
        RESPOND PREFIX="//" MSG="Tester le maillage avant impression // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 2 %}
        RESPOND PREFIX="//" MSG="Tester le maillage avant impression + KAMP // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 3 %}
        RESPOND PREFIX="//" MSG="Tester le maillage avant impression + AutoZOffset // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 4 %}
        RESPOND PREFIX="//" MSG="Tester le maillage avant impression + AutoZOffset + KAMP // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : MESH_TEST // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=mesh_test VALUE={zmesh_test}

    {% set zmidi_start = printer.save_variables.variables['midi_start']|default("")|string %}
    RESPOND PREFIX="//" MSG="Jouer MIDI au démarrage : {zmidi_start} // SAVE_ZMOD_DATA MIDI_START=\"{zmidi_start}\""
    SAVE_VARIABLE VARIABLE=midi_start VALUE="\"{zmidi_start}\""

    {% set zmidi_pause = printer.save_variables.variables['midi_pause']|default("")|string %}
    RESPOND PREFIX="//" MSG="Jouer MIDI lors de la pause : {zmidi_pause} // SAVE_ZMOD_DATA MIDI_PAUSE=\"{zmidi_pause}\""
    SAVE_VARIABLE VARIABLE=midi_pause VALUE="\"{zmidi_pause}\""

    {% set zforce_md5 = printer.save_variables.variables['force_md5']|default(0)|int %}
    {% if zforce_md5 != 0 and zforce_md5 != 1 %}
        {% set zforce_md5 = 0 %}
    {% endif %}
    {% if zforce_md5 == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas vérifier la somme MD5 // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% elif zforce_md5 == 1 %}
        RESPOND PREFIX="//" MSG="Vérifier la somme MD5 du fichier // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : FORCE_MD5 // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=force_md5 VALUE={zforce_md5}

    {% set zdisable_skew = printer.save_variables.variables['disable_skew']|default(1)|int %}
    {% if zdisable_skew != 0 and zdisable_skew != 1 %}
        {% set zdisable_skew = 1 %}
    {% endif %}
    {% if zdisable_skew == 0 %}
        RESPOND PREFIX="//" MSG="Correction SKEW activée. Profil skew_profile // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% elif zdisable_skew == 1 %}
        RESPOND PREFIX="//" MSG="Correction SKEW désactivée // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : DISABLE_SKEW // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=disable_skew VALUE={zdisable_skew}

    {% set zload_zoffset = printer.save_variables.variables['load_zoffset']|default(1)|int %}
    {% if zload_zoffset != 0 and zload_zoffset != 1 %}
        {% set zload_zoffset = 1 %}
    {% endif %}
    {% if zload_zoffset == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas charger le Z-Offset des paramètres globaux // SAVE_ZMOD_DATA LOAD_ZOFFSET={zload_zoffset}"
    {% elif zload_zoffset == 1 %}
        RESPOND PREFIX="//" MSG="Charger le Z-Offset des paramètres globaux // SAVE_ZMOD_DATA LOAD_ZOFFSET={zload_zoffset}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : LOAD_ZOFFSET // SAVE_ZMOD_DATA LOAD_ZOFFSET={zload_zoffset}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=load_zoffset VALUE={zload_zoffset}

    {% set zdisable_priming = printer.save_variables.variables['disable_priming']|default(0)|int %}
    {% if zdisable_priming != 0 and zdisable_priming != 1 %}
        {% set zdisable_priming = 0 %}
    {% endif %}
    {% if zdisable_priming == 0 %}
        RESPOND PREFIX="//" MSG="Activer la purge de buse // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% elif zdisable_priming == 1 %}
        RESPOND PREFIX="//" MSG="Désactiver la purge de buse // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : DISABLE_PRIMING // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=disable_priming VALUE={zdisable_priming}

    {% set zsilent = printer.save_variables.variables['silent']|default(0)|int %}
    {% if zsilent != 0 and zsilent != 1 and zsilent != 2 %}
        {% set zsilent = 0 %}
    {% endif %}
    {% if zsilent == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas masquer la sélection de couleur au démarrage de l'impression // SAVE_ZMOD_DATA SILENT={zsilent}"
    {% elif zsilent == 1 %}
        RESPOND PREFIX="//" MSG="Masquer la sélection de couleur, imprimer avec IFS // SAVE_ZMOD_DATA SILENT={zsilent}"
    {% elif zsilent == 2 %}
        RESPOND PREFIX="//" MSG="Masquer la sélection de couleur, imprimer sans IFS // SAVE_ZMOD_DATA SILENT={zsilent}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : SILENT // SAVE_ZMOD_DATA SILENT={zsilent}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=silent VALUE={zsilent}

    {% if printer.save_variables.variables['disable_priming'] == 0 %}
        {% set zclear = printer.save_variables.variables['clear']|default("LINE_PURGE")|string %}
        RESPOND PREFIX="//" MSG="Algorithme de purge : {zclear} // SAVE_ZMOD_DATA CLEAR=\"{zclear}\""
        SAVE_VARIABLE VARIABLE=clear VALUE="\"{zclear}\""
    {% endif %}

    RESPOND PREFIX="info" MSG="Paramètres utilisés pendant l'impression"

    {% set zuse_trash_on_print = printer.save_variables.variables['use_trash_on_print']|default(1)|int %}
    {% if zuse_trash_on_print != 0 and zuse_trash_on_print != 1 and zuse_trash_on_print != 2 %}
        {% set zuse_trash_on_print = 1 %}
    {% endif %}
    {% if zuse_trash_on_print == 0 %}
        RESPOND PREFIX="//" MSG="Ne pas utiliser le bac de purge pendant l'impression // SAVE_ZMOD_DATA USE_TRASH_ON_PRINT={zuse_trash_on_print}"
    {% elif zuse_trash_on_print == 1 %}
        RESPOND PREFIX="//" MSG="Utiliser le bac de purge pendant l'impression // SAVE_ZMOD_DATA USE_TRASH_ON_PRINT={zuse_trash_on_print}"
    {% elif zuse_trash_on_print == 2 %}
        RESPOND PREFIX="//" MSG="Purge contrôlée par le trancheur // SAVE_ZMOD_DATA USE_TRASH_ON_PRINT={zuse_trash_on_print}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valeur non reconnue pour le paramètre : USE_TRASH_ON_PRINT // SAVE_ZMOD_DATA USE_TRASH_ON_PRINT={zuse_trash_on_print}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=use_trash_on_print VALUE={zuse_trash_on_print}

    {% set zalways_full_color_change = printer.save_variables.variables['always_full_color_change']|default(0)|int %}
    {% if zalways_full_color_change != 0 and zalways_full_color_change != 1 %}
