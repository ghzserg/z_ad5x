        {% set this_page_visible_items = this_page_visible_items + 1 %}
        {% set lang = printer.configfile.config.zmod.language|default("en") | string %}
        RESPOND TYPE=command MSG="action:prompt_button Language {lang}|LANG|primary"

        RESPOND TYPE=command MSG="action:prompt_footer_button Suivant|_GLOBAL N=10|red"
        RESPOND TYPE=command MSG="action:prompt_show"
        {% if this_page_visible_items == 0 %}
            RESPOND TYPE=command MSG="action:prompt_end"
            {% set n = 10 %}
        {% endif %}
    {% endif %}

    {% if n == 10 and start == 0 %}
        {% set this_page_visible_items = 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin 10: Paramètres système"

        {% set this_page_visible_items = this_page_visible_items + 1 %}
        RESPOND TYPE=command MSG="action:prompt_button Reset Z-Mod Global| _RESET_ZMOD|orange"

        RESPOND TYPE=command MSG="action:prompt_footer_button Suivant|_GLOBAL N=11|red"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

    {% if n >= 11 and start == 0 %}
        _SHOW_MSG MSG="Si des paramètres ont été modifiés, il est recommandé de redémarrer l'imprimante. Macro GLOBAL" COMMAND='_GLOBAL_SAVE PARAM=skip_global' COMMAND_REBOOT="_GLOBAL_SAVE PARAM=skip_global REBOOT=1"
    {% endif %}
    # End script-generated _GLOBAL code

