[gcode_macro _GLOBAL]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}

    {% set skip_global = printer.save_variables.variables['skip_global']|default(0) | int %}
    {% set skip_lang = printer.save_variables.variables['skip_lang']|default(0) | int %}
    {% set skip_recommend = printer.save_variables.variables['skip_recommend']|default(0) | int %}
    {% set skip_link = printer.save_variables.variables['skip_link']|default(0) | int %}

    {% set n = params.N|default(1)|int %}
    {% set start = params.START|default(0)|int %}

    {% if skip_global == 0 and skip_lang == 1 and start == 1 %}
        _SHOW_MSG MSG="Vous pouvez parcourir et modifier les paramètres globaux si nécessaire. https://wiki.zmod.link/Global/" COMMAND="_GLOBAL"
    {% endif %}

    {% if skip_link == 0 and skip_global == 1 and skip_lang == 1 and skip_recommend == 1 and start == 1 %}
        _SHOW_MSG MSG="Saviez-vous que vous pouvez accéder à votre imprimante à distance en utilisant zmod.link ?" COMMAND="_GLOBAL_SAVE PARAM='skip_link'"
    {% endif %}

    {% if start == 0 %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% endif %}

    # Begin script-generated _GLOBAL code

    {% if n == 1 and start == 0 %}
        {% set this_page_visible_items = 0 %}
        RESPOND TYPE=command MSG="action:prompt_begin 1: Paramètres utilisés dans le menu de sélection des couleurs"

        {% set zallowed_tool_count = printer.save_variables.variables['allowed_tool_count']|default(4)|int %}
        {% if zallowed_tool_count == 4 %}
            RESPOND TYPE=command MSG="action:prompt_button Afficher {zallowed_tool_count} couleurs quand les couleurs du fichier ne peuvent pas être lues|SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT=8 I=1|primary"
        {% elif zallowed_tool_count == 8 %}
            RESPOND TYPE=command MSG="action:prompt_button Afficher {zallowed_tool_count} couleurs quand les couleurs du fichier ne peuvent pas être lues|SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT=16 I=1|primary"
        {% elif zallowed_tool_count == 16 %}
            RESPOND TYPE=command MSG="action:prompt_button Afficher {zallowed_tool_count} couleurs quand les couleurs du fichier ne peuvent pas être lues|SAVE_ZMOD_DATA ALLOWED_TOOL_COUNT=4 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button Afficher {zallowed_tool_count} couleurs quand les couleurs du fichier ne peuvent pas être lues|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zscan_file_colors = printer.save_variables.variables['scan_file_colors']|default(0)|int %}
        {% if zscan_file_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Ne pas numériser les fichiers pour les données de couleur / matériel|SAVE_ZMOD_DATA SCAN_FILE_COLORS=2 I=1|primary"
        {% elif zscan_file_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Vérifier uniquement les données de couleur / matériel pré-préparées dans les fichiers|SAVE_ZMOD_DATA SCAN_FILE_COLORS=1 I=1|primary"
        {% elif zscan_file_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Numériser les fichiers pour les données de couleur / matériel|SAVE_ZMOD_DATA SCAN_FILE_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button SCAN_FILE_COLORS valeur personnalisée : {zscan_file_colors}|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

        {% set zauto_assign_colors = printer.save_variables.variables['auto_assign_colors']|default(0)|int %}
        {% if zauto_assign_colors == 0 %}
            RESPOND TYPE=command MSG="action:prompt_button Ne pas assigner les couleurs automatiquement|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=30 I=1|primary"
        {% elif zauto_assign_colors == 30 %}
            RESPOND TYPE=command MSG="action:prompt_button Assignation auto des couleurs, le mode silencieux s'arrête sur toute erreur|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=2 I=1|primary"
        {% elif zauto_assign_colors == 2 %}
            RESPOND TYPE=command MSG="action:prompt_button Assignation auto des couleurs, le mode silencieux s'arrête sur une erreur majeure|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=1 I=1|primary"
        {% elif zauto_assign_colors == 1 %}
            RESPOND TYPE=command MSG="action:prompt_button Assigner les couleurs automatiquement|SAVE_ZMOD_DATA AUTO_ASSIGN_COLORS=0 I=1|primary"
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_button Assignation auto des couleurs, le mode silencieux s'arrête sur certaines erreurs|_GLOBAL N=1|grey"
        {% endif %}
        {% set this_page_visible_items = this_page_visible_items + 1 %}

