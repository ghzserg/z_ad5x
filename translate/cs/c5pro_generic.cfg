[gcode_macro _GOTO_SHAPER]
gcode:
    _T_IN T=1
    G1 X130 Y130 F6000
    M400

[gcode_macro _GOTO_END_SHAPER]
gcode:
    _T_OUT NO_Z=0

[gcode_macro COLOR]
gcode:
    GET_ZCOLOR

[gcode_macro RESET_ZCOLOR]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    CHANGE_ZCOLOR SLOT=1 HEX=FEF043 TYPE=PLA
    CHANGE_ZCOLOR SLOT=2 HEX=FFFFFF TYPE=PLA
    CHANGE_ZCOLOR SLOT=3 HEX=161616 TYPE=PLA
    CHANGE_ZCOLOR SLOT=4 HEX=F72224 TYPE=PLA

[gcode_macro PROBE]
rename_existing: _PROBE
gcode:
    _T_OUT SAVE_T=1 SAVE_T_TEMP=0
        _PROBE
    _T_RESTORE

[gcode_macro _T_OUT_ZCOLOR]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    _G28
    _T_OUT HEATER_OFF=1 NO_Z=0
    COLOR

