[zmod]
c5pro: True

[zmod_color]

[save_variables]
filename: /usr/data/config/mod_data/variables.cfg

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True    ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 250.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 256.0  ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 50.0    ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_speed_hop        : 25.0    ; z move speed in mm/s
variable_speed_move       : 300.0   ; move speed in mm/s
variable_park_at_cancel   : True    ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : 250.50   ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : 256.00  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_use_fw_retract   : False   ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 86400   ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : ""
variable_runout_sensor2   : ""
variable_user_pause_macro : "_PAUSE_MACRO"   ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: "_RESUME_MACRO"  ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: "_COMMON_END_PRINT"
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_max_x            : 256.0
variable_max_y            : 256.0
variable_min_x            : 0.0
variable_min_y            : 0.0
variable_ad5m             : False
variable_ad5x             : False
variable_c5pro            : True
variable_video            : "video67"
gcode:
    M105

# Регулировка винтов
[screws_tilt_adjust]
screw1: 30, 232.5
screw1_name: Left Rear (Base)
screw2: 30, 14
screw2_name: Left Front
screw3: 248.5, 14
screw3_name: Right Front
screw4: 248.5, 232.5
screw4_name: Right Rear
horizontal_move_z: 5
speed: 50
screw_thread: CW-M4

[gcode_macro _HOME]
gcode:
    _T_G28

[gcode_macro _CLEAR1]
description: Kód čištění z Orca Slicer
gcode:
    RESPOND PREFIX="info" MSG="_CLEAR1"
    G90
    M83
    G1 E-0.2 F800
    G1 Z3 F6000
    G1 X50 Y256 Z0.25 F4800
    M400

    G1 X70 E3 F900
    G1 X200 E10 F1800
    G0 Y255.6
    G1 X130 E5 F1800
    G92 E0

