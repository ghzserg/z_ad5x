[gcode_macro SAVE_ZMOD_DATA]
description: Salva parametri Z-Mod
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set i = params.I|default(0)|int %}

    # Begin script-generated SAVE_ZMOD_DATA code

    {% if params.PRINT_LEVELING %}
        {% set zprint_leveling = params.PRINT_LEVELING|default(0)|int %}
        SAVE_VARIABLE VARIABLE=print_leveling VALUE={zprint_leveling}
    {% endif %}

    {% if params.USE_KAMP %}
        {% set zuse_kamp = params.USE_KAMP|default(0)|int %}
        SAVE_VARIABLE VARIABLE=use_kamp VALUE={zuse_kamp}
    {% endif %}

    {% if params.MESH_TEST %}
        {% set zmesh_test = params.MESH_TEST|default(0)|int %}
        SAVE_VARIABLE VARIABLE=mesh_test VALUE={zmesh_test}
    {% endif %}

    {% if params.MIDI_START %}
        {% set zmidi_start = params.MIDI_START|default("")|string %}
        {% if zmidi_start == "0" %}
            {% set zmidi_start = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_start VALUE="\"{zmidi_start}\""
    {% endif %}

    {% if params.MIDI_PAUSE %}
        {% set zmidi_pause = params.MIDI_PAUSE|default("")|string %}
        {% if zmidi_pause == "0" %}
            {% set zmidi_pause = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_pause VALUE="\"{zmidi_pause}\""
    {% endif %}

    {% if params.FORCE_MD5 %}
        {% set zforce_md5 = params.FORCE_MD5|default(0)|int %}
        SAVE_VARIABLE VARIABLE=force_md5 VALUE={zforce_md5}
    {% endif %}

    {% if params.DISABLE_SKEW %}
        {% set zdisable_skew = params.DISABLE_SKEW|default(1)|int %}
        SAVE_VARIABLE VARIABLE=disable_skew VALUE={zdisable_skew}
    {% endif %}

    {% if params.DISABLE_PRIMING %}
        {% set zdisable_priming = params.DISABLE_PRIMING|default(0)|int %}
        SAVE_VARIABLE VARIABLE=disable_priming VALUE={zdisable_priming}
    {% endif %}

    {% if params.PRECLEAR %}
        {% set zpreclear = params.PRECLEAR|default(0)|int %}
        SAVE_VARIABLE VARIABLE=preclear VALUE={zpreclear}
    {% endif %}

    {% if params.CLEAR %}
        {% set zclear = params.CLEAR|default("LINE_PURGE")|string %}
        {% if zclear == "0" %}
            {% set zclear = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=clear VALUE="\"{zclear}\""
    {% endif %}

    {% if params.MIDI_END %}
        {% set zmidi_end = params.MIDI_END|default("")|string %}
        {% if zmidi_end == "0" %}
            {% set zmidi_end = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_end VALUE="\"{zmidi_end}\""
    {% endif %}

    {% if params.CLOSE_DIALOGS %}
        {% set zclose_dialogs = params.CLOSE_DIALOGS|default(2)|int %}
        SAVE_VARIABLE VARIABLE=close_dialogs VALUE={zclose_dialogs}
    {% endif %}

    {% if params.STOP_MOTOR %}
        {% set zstop_motor = params.STOP_MOTOR|default(1)|int %}
        SAVE_VARIABLE VARIABLE=stop_motor VALUE={zstop_motor}
    {% endif %}

    {% if params.AUTO_REBOOT %}
        {% set zauto_reboot = params.AUTO_REBOOT|default(0)|int %}
        SAVE_VARIABLE VARIABLE=auto_reboot VALUE={zauto_reboot}
    {% endif %}

    {% if params.PRO_POWEROFF_TIMEOUT %}
        {% set zpro_poweroff_timeout = params.PRO_POWEROFF_TIMEOUT|default(0)|int %}
        SAVE_VARIABLE VARIABLE=pro_poweroff_timeout VALUE={zpro_poweroff_timeout}
    {% endif %}

    {% if params.MOTION_SENSOR %}
        {% set zmotion_sensor = params.MOTION_SENSOR|default(0)|int %}
        SAVE_VARIABLE VARIABLE=motion_sensor VALUE={zmotion_sensor}
    {% endif %}

    {% if params.FIX_SCV %}
        {% set zfix_scv = params.FIX_SCV|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_scv VALUE={zfix_scv}
    {% endif %}

    {% if params.FIX_E0011 %}
        {% set zfix_e0011 = params.FIX_E0011|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_e0011 VALUE={zfix_e0011}
    {% endif %}

    {% if params.FIX_E0017 %}
        {% set zfix_e0017 = params.FIX_E0017|default(1)|int %}
        SAVE_VARIABLE VARIABLE=fix_e0017 VALUE={zfix_e0017}
    {% endif %}

    {% if params.WIFI %}
        {% set zwifi = params.WIFI|default(1)|int %}
        SAVE_VARIABLE VARIABLE=wifi VALUE={zwifi}
    {% endif %}

    {% if params.LED %}
        {% set zled = params.LED|default(50)|int %}
        SAVE_VARIABLE VARIABLE=led VALUE={zled}
    {% endif %}

    {% if params.MIDI_ON %}
        {% set zmidi_on = params.MIDI_ON|default("")|string %}
        {% if zmidi_on == "0" %}
            {% set zmidi_on = "" %}
        {% endif %}
        SAVE_VARIABLE VARIABLE=midi_on VALUE="\"{zmidi_on}\""
    {% endif %}

    {% if params.NEW_SAVE_CONFIG %}
        {% set znew_save_config = params.NEW_SAVE_CONFIG|default(0)|int %}
        SAVE_VARIABLE VARIABLE=new_save_config VALUE={znew_save_config}
    {% endif %}

    {% if params.USE_SWAP %}
        {% set zuse_swap = params.USE_SWAP|default(1)|int %}
        SAVE_VARIABLE VARIABLE=use_swap VALUE={zuse_swap}
    {% endif %}

    {% if params.CHINA_CLOUD %}
        {% set zchina_cloud = params.CHINA_CLOUD|default(1)|int %}
        SAVE_VARIABLE VARIABLE=china_cloud VALUE={zchina_cloud}
    {% endif %}

    {% if params.SAVE_MOONRAKER %}
        {% set zsave_moonraker = params.SAVE_MOONRAKER|default(0)|int %}
        SAVE_VARIABLE VARIABLE=save_moonraker VALUE={zsave_moonraker}
    {% endif %}

    {% if params.SAVE_FILAMENT_SENSORS %}
        {% set zsave_filament_sensors = params.SAVE_FILAMENT_SENSORS|default(0)|int %}
        SAVE_VARIABLE VARIABLE=save_filament_sensors VALUE={zsave_filament_sensors}
    {% endif %}

    {% if params.KLIPPER13 %}
        {% set zklipper13 = params.KLIPPER13|default(0)|int %}
        SAVE_VARIABLE VARIABLE=klipper13 VALUE={zklipper13}
    {% endif %}

    {% if params.NICE %}
        {% set znice = params.NICE|default(20)|int %}
        SAVE_VARIABLE VARIABLE=nice VALUE={znice}
    {% endif %}

    {% if params.ZCONTROL_Z %}
        {% set zzcontrol_z = params.ZCONTROL_Z|default(10)|int %}
        SAVE_VARIABLE VARIABLE=zcontrol_z VALUE={zzcontrol_z}
    {% endif %}

    # End script-generated SAVE_ZMOD_DATA code

    {% if i == 0 %}
        GET_ZMOD_DATA
    {% else %}
        _GLOBAL N={i}
    {% endif %}

[gcode_macro GET_ZMOD_DATA]
description: Ottieni parametri Z-Mod
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set screen = printer["gcode_macro _SCREEN"].screen %}

    RESPOND PREFIX="info" MSG="Parametri Z-Mod. Impostati tramite SAVE_ZMOD_DATA"

    {% set guppy = printer.save_variables.variables['guppy']|default(1) | int %}
    SAVE_VARIABLE VARIABLE=guppy VALUE={guppy|int}

    {% set helix = printer.save_variables.variables['helix']|default(0) | int %}
    SAVE_VARIABLE VARIABLE=helix VALUE={helix|int}

    {% if screen == True %}
        RESPOND PREFIX="info" MSG="Stai usando lo schermo nativo // DISPLAY_ON"
    {% else %}
        {% if helix == 1 %}
            RESPOND PREFIX="info" MSG="Stai lavorando SENZA schermo nativo con HelixScreen // DISPLAY_OFF HELIX=1"
            SAVE_VARIABLE VARIABLE=guppy VALUE=0
        {% elif guppy == 1 %}
            RESPOND PREFIX="info" MSG="Stai lavorando SENZA schermo nativo ma CON GuppyScreen // DISPLAY_OFF GUPPY=1"
            SAVE_VARIABLE VARIABLE=helix VALUE=0
        {% else %}
            RESPOND PREFIX="info" MSG="Stai lavorando SENZA schermo nativo // DISPLAY_OFF GUPPY=0"
        {% endif %}
    {% endif %}

    # Begin script-generated GET_ZMOD_DATA code

    RESPOND PREFIX="info" MSG="Parametri utilizzati nel menu di selezione colore"

    RESPOND PREFIX="info" MSG="Parametri usati all'inizio e livellamento del piatto [START_PRINT]"

    {% set zprint_leveling = printer.save_variables.variables['print_leveling']|default(0)|int %}
    {% if zprint_leveling != 0 and zprint_leveling != 1 %}
        {% set zprint_leveling = 0 %}
    {% endif %}
    {% if zprint_leveling == 0 %}
        RESPOND PREFIX="//" MSG="Non costruire la rete del letto su ogni stampa // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% elif zprint_leveling == 1 %}
        RESPOND PREFIX="//" MSG="Crea la griglia del piatto tramite lo schermo nativo ad ogni stampa. // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: PRINT_LEVELING // SAVE_ZMOD_DATA PRINT_LEVELING={zprint_leveling}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=print_leveling VALUE={zprint_leveling}

    {% set zuse_kamp = printer.save_variables.variables['use_kamp']|default(0)|int %}
    {% if zuse_kamp != 0 and zuse_kamp != 1 %}
        {% set zuse_kamp = 0 %}
    {% endif %}
    {% if zuse_kamp == 0 %}
        RESPOND PREFIX="//" MSG="Non usare KAMP al posto di BED_MESH_CALIBRATE // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% elif zuse_kamp == 1 %}
        RESPOND PREFIX="//" MSG="Usa griglia adattiva (KAMP) dove possibile invece di griglia completa // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: USE_KAMP // SAVE_ZMOD_DATA USE_KAMP={zuse_kamp}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=use_kamp VALUE={zuse_kamp}

    {% set zmesh_test = printer.save_variables.variables['mesh_test']|default(0)|int %}
    {% if zmesh_test != 0 and zmesh_test != 1 and zmesh_test != 2 and zmesh_test != 3 and zmesh_test != 4 %}
        {% set zmesh_test = 0 %}
    {% endif %}
    {% if zmesh_test == 0 %}
        RESPOND PREFIX="//" MSG="Non testare la griglia del piatto prima della stampa // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 1 %}
        RESPOND PREFIX="//" MSG="Testa la griglia del piatto prima della stampa // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 2 %}
        RESPOND PREFIX="//" MSG="Testa la griglia del piatto prima della stampa + KAMP // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 3 %}
        RESPOND PREFIX="//" MSG="Testa la griglia del piatto prima della stampa + AutoZOffset // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% elif zmesh_test == 4 %}
        RESPOND PREFIX="//" MSG="Testa la griglia del piatto prima della stampa + AutoZOffset + KAMP // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: MESH_TEST // SAVE_ZMOD_DATA MESH_TEST={zmesh_test}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=mesh_test VALUE={zmesh_test}

    {% set zmidi_start = printer.save_variables.variables['midi_start']|default("")|string %}
    RESPOND PREFIX="//" MSG="Riproduci MIDI all'inizio della stampa: {zmidi_start} // SAVE_ZMOD_DATA MIDI_START=\"{zmidi_start}\""
    SAVE_VARIABLE VARIABLE=midi_start VALUE="\"{zmidi_start}\""

    {% set zmidi_pause = printer.save_variables.variables['midi_pause']|default("")|string %}
    RESPOND PREFIX="//" MSG="Riproduci MIDI durante la pausa: {zmidi_pause} // SAVE_ZMOD_DATA MIDI_PAUSE=\"{zmidi_pause}\""
    SAVE_VARIABLE VARIABLE=midi_pause VALUE="\"{zmidi_pause}\""

    {% set zforce_md5 = printer.save_variables.variables['force_md5']|default(0)|int %}
    {% if zforce_md5 != 0 and zforce_md5 != 1 %}
        {% set zforce_md5 = 0 %}
    {% endif %}
    {% if zforce_md5 == 0 %}
        RESPOND PREFIX="//" MSG="Non verificare la somma MD5 del file // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% elif zforce_md5 == 1 %}
        RESPOND PREFIX="//" MSG="Verifica la somma di controllo MD5 del file // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: FORCE_MD5 // SAVE_ZMOD_DATA FORCE_MD5={zforce_md5}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=force_md5 VALUE={zforce_md5}

    {% set zdisable_skew = printer.save_variables.variables['disable_skew']|default(1)|int %}
    {% if zdisable_skew != 0 and zdisable_skew != 1 %}
        {% set zdisable_skew = 1 %}
    {% endif %}
    {% if zdisable_skew == 0 %}
        RESPOND PREFIX="//" MSG="Correzione SKEW abilitata. Profilo skew_profile // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% elif zdisable_skew == 1 %}
        RESPOND PREFIX="//" MSG="Correzione SKEW disabilitata // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: DISABLE_SKEW // SAVE_ZMOD_DATA DISABLE_SKEW={zdisable_skew}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=disable_skew VALUE={zdisable_skew}

    {% set zdisable_priming = printer.save_variables.variables['disable_priming']|default(0)|int %}
    {% if zdisable_priming != 0 and zdisable_priming != 1 %}
        {% set zdisable_priming = 0 %}
    {% endif %}
    {% if zdisable_priming == 0 %}
        RESPOND PREFIX="//" MSG="Abilita la purga della linea dell'ugello // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% elif zdisable_priming == 1 %}
        RESPOND PREFIX="//" MSG="Disabilita la purga della linea dell'ugello // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: DISABLE_PRIMING // SAVE_ZMOD_DATA DISABLE_PRIMING={zdisable_priming}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=disable_priming VALUE={zdisable_priming}

    {% set zpreclear = printer.save_variables.variables['preclear']|default(0)|int %}
    {% if zpreclear != 0 and zpreclear != 1 %}
        {% set zpreclear = 0 %}
    {% endif %}
    {% if zpreclear == 0 %}
        RESPOND PREFIX="//" MSG="Non usare la pre-purga dell'ugello // SAVE_ZMOD_DATA PRECLEAR={zpreclear}"
    {% elif zpreclear == 1 %}
        RESPOND PREFIX="//" MSG="Usa pre-purga dell'ugello // SAVE_ZMOD_DATA PRECLEAR={zpreclear}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: PRECLEAR // SAVE_ZMOD_DATA PRECLEAR={zpreclear}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=preclear VALUE={zpreclear}

    {% if printer.save_variables.variables['disable_priming'] == 0 %}
        {% set zclear = printer.save_variables.variables['clear']|default("LINE_PURGE")|string %}
        RESPOND PREFIX="//" MSG="Algoritmo di purga: {zclear} // SAVE_ZMOD_DATA CLEAR=\"{zclear}\""
        SAVE_VARIABLE VARIABLE=clear VALUE="\"{zclear}\""
    {% endif %}

    RESPOND PREFIX="info" MSG="Parametri utilizzati durante la stampa"

    RESPOND PREFIX="info" MSG="Parametri usati alla fine e annullamento della stampa [END_PRINT]"

    {% set zmidi_end = printer.save_variables.variables['midi_end']|default("")|string %}
    RESPOND PREFIX="//" MSG="Riproduci MIDI alla fine della stampa: {zmidi_end} // SAVE_ZMOD_DATA MIDI_END=\"{zmidi_end}\""
    SAVE_VARIABLE VARIABLE=midi_end VALUE="\"{zmidi_end}\""

    {% set zclose_dialogs = printer.save_variables.variables['close_dialogs']|default(2)|int %}
    {% if zclose_dialogs != 0 and zclose_dialogs != 1 and zclose_dialogs != 2 %}
        {% set zclose_dialogs = 2 %}
    {% endif %}
    {% if zclose_dialogs == 0 %}
        RESPOND PREFIX="//" MSG="Non chiudere le finestre sullo schermo nativo // SAVE_ZMOD_DATA CLOSE_DIALOGS={zclose_dialogs}"
    {% elif zclose_dialogs == 1 %}
        RESPOND PREFIX="//" MSG="Chiudi automaticamente le finestre sullo schermo nativo dopo 20 secondi (lento) // SAVE_ZMOD_DATA CLOSE_DIALOGS={zclose_dialogs}"
    {% elif zclose_dialogs == 2 %}
        RESPOND PREFIX="//" MSG="Chiudi automaticamente le finestre sullo schermo nativo dopo 20 secondi (veloce) // SAVE_ZMOD_DATA CLOSE_DIALOGS={zclose_dialogs}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: CLOSE_DIALOGS // SAVE_ZMOD_DATA CLOSE_DIALOGS={zclose_dialogs}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=close_dialogs VALUE={zclose_dialogs}

    {% set zstop_motor = printer.save_variables.variables['stop_motor']|default(1)|int %}
    {% if zstop_motor != 0 and zstop_motor != 1 %}
        {% set zstop_motor = 1 %}
    {% endif %}
    {% if zstop_motor == 0 %}
        RESPOND PREFIX="//" MSG="Non disattivare automaticamente i motori dopo la stampa/annullamento // SAVE_ZMOD_DATA STOP_MOTOR={zstop_motor}"
    {% elif zstop_motor == 1 %}
        RESPOND PREFIX="//" MSG="Disattiva automaticamente i motori dopo la stampa/annullamento in 25 secondi // SAVE_ZMOD_DATA STOP_MOTOR={zstop_motor}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: STOP_MOTOR // SAVE_ZMOD_DATA STOP_MOTOR={zstop_motor}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=stop_motor VALUE={zstop_motor}

    {% set zauto_reboot = printer.save_variables.variables['auto_reboot']|default(0)|int %}
    {% if zauto_reboot != 0 and zauto_reboot != 1 %}
        {% set zauto_reboot = 0 %}
    {% endif %}
    {% if zauto_reboot == 0 %}
        RESPOND PREFIX="//" MSG="Non riavviare automaticamente la stampante // SAVE_ZMOD_DATA AUTO_REBOOT={zauto_reboot}"
    {% elif zauto_reboot == 1 %}
        RESPOND PREFIX="//" MSG="Riavvia automaticamente la stampante dopo 1.5 minuti // SAVE_ZMOD_DATA AUTO_REBOOT={zauto_reboot}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: AUTO_REBOOT // SAVE_ZMOD_DATA AUTO_REBOOT={zauto_reboot}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=auto_reboot VALUE={zauto_reboot}

    {% set zpro_poweroff_timeout = printer.save_variables.variables['pro_poweroff_timeout']|default(0)|int %}
    {% if zpro_poweroff_timeout < 0 %}
        {% set zpro_poweroff_timeout = 0 %}
    {% endif %}
    RESPOND PREFIX="//" MSG="Spegni FF5M Pro dopo (min): {zpro_poweroff_timeout} // SAVE_ZMOD_DATA PRO_POWEROFF_TIMEOUT={zpro_poweroff_timeout}"
    SAVE_VARIABLE VARIABLE=pro_poweroff_timeout VALUE={zpro_poweroff_timeout}

    RESPOND PREFIX="info" MSG="Parametri di sistema"

    {% set zmotion_sensor = printer.save_variables.variables['motion_sensor']|default(0)|int %}
    {% if zmotion_sensor != 0 and zmotion_sensor != 1 %}
        {% set zmotion_sensor = 0 %}
    {% endif %}
    {% if zmotion_sensor == 0 %}
        RESPOND PREFIX="//" MSG="Usando sensore di presenza del filamento // SAVE_ZMOD_DATA MOTION_SENSOR={zmotion_sensor}"
    {% elif zmotion_sensor == 1 %}
        RESPOND PREFIX="//" MSG="Usando sensore di movimento del filamento // SAVE_ZMOD_DATA MOTION_SENSOR={zmotion_sensor}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: MOTION_SENSOR // SAVE_ZMOD_DATA MOTION_SENSOR={zmotion_sensor}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=motion_sensor VALUE={zmotion_sensor}

    {% set zfix_scv = printer.save_variables.variables['fix_scv']|default(1)|int %}
    {% if zfix_scv != 0 and zfix_scv != 1 %}
        {% set zfix_scv = 1 %}
    {% endif %}
    {% if zfix_scv == 0 %}
        RESPOND PREFIX="//" MSG="Usa SCV = 5 per grafici dello shaper // SAVE_ZMOD_DATA FIX_SCV={zfix_scv}"
    {% elif zfix_scv == 1 %}
        RESPOND PREFIX="//" MSG="Usa SCV dalla configurazione per grafici dello shaper // SAVE_ZMOD_DATA FIX_SCV={zfix_scv}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: FIX_SCV // SAVE_ZMOD_DATA FIX_SCV={zfix_scv}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=fix_scv VALUE={zfix_scv}

    {% set zfix_e0011 = printer.save_variables.variables['fix_e0011']|default(1)|int %}
    {% if zfix_e0011 != 0 and zfix_e0011 != 1 %}
        {% set zfix_e0011 = 1 %}
    {% endif %}
    {% if zfix_e0011 == 0 %}
        RESPOND PREFIX="//" MSG="Non correggere l'errore E0011 // SAVE_ZMOD_DATA FIX_E0011={zfix_e0011}"
    {% elif zfix_e0011 == 1 %}
        RESPOND PREFIX="//" MSG="Correggi errore E0011 // SAVE_ZMOD_DATA FIX_E0011={zfix_e0011}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: FIX_E0011 // SAVE_ZMOD_DATA FIX_E0011={zfix_e0011}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=fix_e0011 VALUE={zfix_e0011}

    {% set zfix_e0017 = printer.save_variables.variables['fix_e0017']|default(1)|int %}
    {% if zfix_e0017 != 0 and zfix_e0017 != 1 %}
        {% set zfix_e0017 = 1 %}
    {% endif %}
    {% if zfix_e0017 == 0 %}
        RESPOND PREFIX="//" MSG="Non correggere l'errore E0017 // SAVE_ZMOD_DATA FIX_E0017={zfix_e0017}"
    {% elif zfix_e0017 == 1 %}
        RESPOND PREFIX="//" MSG="Correggi errore E0017 // SAVE_ZMOD_DATA FIX_E0017={zfix_e0017}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: FIX_E0017 // SAVE_ZMOD_DATA FIX_E0017={zfix_e0017}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=fix_e0017 VALUE={zfix_e0017}

    {% set zwifi = printer.save_variables.variables['wifi']|default(1)|int %}
    {% if zwifi != 0 and zwifi != 1 %}
        {% set zwifi = 1 %}
    {% endif %}
    {% if zwifi == 0 %}
        RESPOND PREFIX="//" MSG="Z-Mod Wifi Off // SAVE_ZMOD_DATA WIFI={zwifi}"
    {% elif zwifi == 1 %}
        RESPOND PREFIX="//" MSG="Z-Mod Wifi On // SAVE_ZMOD_DATA WIFI={zwifi}"
    {% else %}
        RESPOND PREFIX="//" MSG="Valore non riconosciuto per l'impostazione: WIFI // SAVE_ZMOD_DATA WIFI={zwifi}"
    {% endif %}
    SAVE_VARIABLE VARIABLE=wifi VALUE={zwifi}

    {% set zled = printer.save_variables.variables['led']|default(50)|int %}
    {% if zled < 0 %}
        {% set zled = 0 %}
    {% endif %}
    {% if zled > 100 %}
        {% set zled = 100 %}
    {% endif %}
