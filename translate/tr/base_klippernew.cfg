[output_pin _extruder_heater]
pin:        eboard: PB7
value:      1
shutdown_value: 0

[temperature_sensor head]
sensor_type: Generic 3950
sensor_pin: eboard:PA1

[gcode_macro TEST_PA]
gcode:
    ZMOD_AUTO_PA {rawparams}

[gcode_macro TEST_PA_EMPTY]
gcode:
    ZMOD_AUTO_PA_EMPTY {rawparams}
