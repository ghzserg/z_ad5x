user root;
worker_processes 1;
pid /root/nginx/nginx.pid;
error_log /root/nginx/error.log crit;

events {
    worker_connections 1024;
}

http {
    include       /usr/data/zmod/zmod/.shell/root/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log /dev/null crit;

    client_body_temp_path /root/nginx/client-body;
    proxy_temp_path /root/nginx/proxy;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream apiserver {
        server 127.0.0.1:7125;
    }

    upstream video {
        server 127.0.0.1:8080;
    }

    upstream screen {
        server 127.0.0.1:8010;
    }

    server {
        listen 80;
        server_name _;
        root /root/mainsail/;
        index index.html;
        client_max_body_size 0;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location /websocket {
            proxy_pass http://apiserver/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        location ~ ^/(printer|api|access|machine|server)/ {
            proxy_pass http://apiserver$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Scheme $scheme;
            proxy_read_timeout 600;
        }

        location /webcam/ {
            postpone_output 0;
            proxy_buffering off;
            proxy_ignore_headers X-Accel-Buffering;
            proxy_pass http://video/;
        }

        location /screen/ {
            postpone_output 0;
            proxy_buffering off;
            proxy_ignore_headers X-Accel-Buffering;
            proxy_pass http://screen/;
        }
    }

    server {
        listen 8082;
        server_name _;
        root /root/mainsail/;
        index index.html;
        client_max_body_size 0;

        location /screen/ {
            postpone_output 0;
            proxy_buffering off;
            proxy_ignore_headers X-Accel-Buffering;
            proxy_pass http://screen/;
        }

        location / {
            proxy_pass http://video;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }
    }
}
