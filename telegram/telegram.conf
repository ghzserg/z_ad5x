# ============================================================
# https://github.com/nlef/moonraker-telegram-bot/wiki/Sample-config
# ============================================================

[bot]
# English
# If your server with the bot is in the same network as the printer
# server: PRINTER_IP:7125
# If the server is remote
# server: 127.0.0.1:MOON_PORT
# MOON_PORT is taken from the ZSSH_ON macro – default is 7125
#
# Russian
# Если у вас сервер c ботом, находится в той же сети, что и принтер
# server: IP_PRINTERA:7125
# Если сервер находится далеко
# server: 127.0.0.1:MOON_PORT
# MOON_PORT берется из макроса ZSSH_ON - по умолчанию 7125
#
# German
# Wenn sich Ihr Server mit dem Bot im selben Netzwerk wie der Drucker befindet
# server: DRUCKER_IP:7125
# Wenn der Server entfernt ist
# server: 127.0.0.1:MOON_PORT
# MOON_PORT wird aus dem Makro ZSSH_ON übernommen – Standard ist 7125
server: 127.0.0.1:7125

# English
# How to register your bot
# - Go to https://t.me/BotFather
# - /newbot
# - Enter any name you like
# - Enter the bot name ff5msuper_bot – must end with _bot
# You get a long ID and paste it into the bot_token parameter
#
# Russian
# Как зарегистрировать свой бот
# - Идете к https://t.me/BotFather
# - /newbot
# - Вводите любое имя, которое вам нравится
# - Вводите имя бота ff5msuper_bot - обязательно _bot в конце.
# Получаете длинный ID и вписываете его в параметр bot_token
#
# German
# So registrieren Sie Ihren Bot
# - Gehen Sie zu https://t.me/BotFather
# - /newbot
# - Geben Sie einen beliebigen Namen ein
# - Geben Sie den Bot-Namen ff5msuper_bot ein – muss auf _bot enden
# Sie erhalten eine lange ID und fügen sie in den Parameter bot_token ein
bot_token: 1111111111:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

# English
# Go to your bot via Telegram
# It will write: Unauthorized access detected with chat_id:
# Enter the received number as chat_id
#
# Russian
# Заходите в своего бота, через телеграм
# Он напишет. Unauthorized access detected with chat_id:
# Впишите полученное числю в chat_id
#
# German
# Gehen Sie zu Ihrem Bot über Telegram
# Es wird schreiben: Unauthorized access detected with chat_id:
# Tragen Sie die erhaltene Nummer als chat_id ein
chat_id: 111111111

[camera]
# English
# If your server with the bot is in the same network as the printer
# host: http://PRINTER_IP:8080/?action=stream
# host_snapshot: http://PRINTER_IP:8080/?action=snapshot
# If the server is remote
# host: http://127.0.0.1:VIDEO_PORT/?action=stream
# host_snapshot: http://127.0.0.1:VIDEO_PORT/?action=snapshot
# VIDEO_PORT is taken from the ZSSH_ON macro – default is 8080
#
# Russian
# Если у вас сервер c ботом, находится в той же сети, что и принтер
# host: http://IP_PRINTERA:8080/?action=stream
# host_snapshot: http://IP_PRINTERA:8080/?action=snapshot
# Если сервер находится далеко
# host: http://127.0.0.1:VIDEO_PORT/?action=stream
# host_snapshot: http://127.0.0.1:VIDEO_PORT/?action=snapshot
# VIDEO_PORT берется из макроса ZSSH_ON - по умолчанию 8080
#
# German
# Wenn sich Ihr Server mit dem Bot im selben Netzwerk wie der Drucker befindet
# host: http://DRUCKER_IP:8080/?action=stream
# host_snapshot: http://DRUCKER_IP:8080/?action=snapshot
# Wenn der Server entfernt ist
# host: http://127.0.0.1:VIDEO_PORT/?action=stream
# host_snapshot: http://127.0.0.1:VIDEO_PORT/?action=snapshot
# VIDEO_PORT wird aus dem Makro ZSSH_ON übernommen – Standard ist 8080
host: http://127.0.0.1:8080/?action=stream
host_snapshot: http://127.0.0.1:8080/?action=snapshot
type: mjpeg
fps: 15
threads: 1

[progress_notification]
percent: 5
height: 0.0
time: 0

[status_message_content]
heaters: extruder, heater_bed
content: progress, height, filament_length, filament_weight, print_duration, eta, finish_time, m117_status, tgnotify_status, last_update_time
fans: fanM106

[telegram_ui]
buttons: [status,pause,cancel,resume],[files,emergency,macros,bot_restart,reboot]
include_macros_in_command_list: true
hidden_macros: check_md5, stop, g17, g18m g19, kamp, m106, m107, m300, m356, m357, m900, bed_mesh_calibrate, start_print, end_print

[timelapse]
# English
# Directory where finished timelapses will be copied
#
# Russian
# Папка куда копируются готовые таймлапсы
#
# German
# Verzeichnis, in das fertige Zeitraffer kopiert werden
copy_finished_timelapse_dir: /home/moonraker-telegram-bot/timelapse_finished
cleanup: true
height: 0.6
target_fps: 15
last_frame_duration: 0
send_finished_lapse: true
